<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} | Prime Spirit Mentors</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{TITLE}}",
  "description": "{{DESCRIPTION}}",
  "datePublished": "{{DATE}}",
  "author": { "@type": "Person", "name": "Abhinav Kashyap" },
  "publisher": { "@type": "EducationalOrganization", "name": "Prime Spirit Mentors" }
}
</script>
<style>
  body {
    background-color: #0a0e27;
    color: #e2e8f0;
    font-family: 'Segoe UI', Roboto, sans-serif;
    margin: 0;
    padding: 0;
    line-height: 1.7;
  }
  .blog-post-header {
    padding: 20px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .blog-post-header a {
    color: #00df89;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
  }
  .blog-post-header a:hover {
    text-decoration: underline;
  }
  .blog-post-container {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }
  .blog-post-container h1 {
    font-size: 2rem;
    line-height: 1.3;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #00C9FF 0%, #00FF88 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .blog-meta {
    color: #8892a6;
    font-size: 0.9rem;
    margin-bottom: 32px;
  }
  article p {
    margin-bottom: 18px;
    color: #cbd5e1;
    font-size: 1.05rem;
  }
  article h2 {
    color: #f8fafc;
    font-size: 1.4rem;
    margin-top: 36px;
    margin-bottom: 12px;
  }
  article h3 {
    color: #f8fafc;
    font-size: 1.15rem;
    margin-top: 28px;
    margin-bottom: 10px;
  }
  .blog-cta {
    margin-top: 48px;
    padding: 24px;
    border-radius: 12px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    text-align: center;
  }
  .blog-cta a {
    display: inline-block;
    margin-top: 12px;
    padding: 10px 24px;
    background: linear-gradient(135deg, #00C9FF 0%, #00FF88 100%);
    color: #0a0e27;
    font-weight: 700;
    text-decoration: none;
    border-radius: 8px;
  }
</style>
</head>
<body>
  <div class="blog-post-header">
    <a href="../index.html#blog-hub"><i class="fas fa-arrow-left"></i> Back to Prime Spirit Mentors</a>
  </div>
  <main class="blog-post-container">
    <h1>{{TITLE}}</h1>
    <p class="blog-meta">{{DATE}} · Prime Spirit Mentors</p>
    <article>
      {{CONTENT}}
    </article>
    <div class="blog-cta">
      <p>Want personalized guidance on this? Talk to Abhinav Kashyap directly.</p>
      <a href="../index.html#contact">Book a Consultation</a>
    </div>
  </main>
</body>
</html>
