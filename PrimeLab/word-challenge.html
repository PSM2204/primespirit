<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#02040a">
    <title>PrimeLab Word Challenge</title>
    
    <!-- GSAP for Premium Animations & Confetti -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg: #02040a;
            --surface: #0a0f1e;
            --border: #1e293b;
            --text: #f4f7ff;
            --text-sec: #94a3b8;
            --accent: #00f3ff;
            --correct: #00ff9d;
            --present: #ffd700;
            --absent: #334155;
            --font-head: 'Syne', sans-serif;
            --font-body: 'Source Serif 4', serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100dvh; /* Dynamic viewport height for mobile */
            overflow: hidden;
            touch-action: manipulation;
        }

        /* --- HEADER --- */
        header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .back-link {
            color: var(--accent);
            text-decoration: none;
            font-family: var(--font-head);
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        h1 {
            font-family: var(--font-head);
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--accent), #bc13fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .icon-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s;
        }
        .icon-btn:active { transform: scale(0.9); background: var(--surface); }

        /* --- LOADING STATE --- */
        #loading-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: var(--font-head);
            color: var(--accent);
            font-size: 1.2rem;
            text-shadow: 0 0 15px rgba(0,243,255,0.3);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* --- TOAST --- */
        #toast-container {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }
        .toast {
            background: var(--text);
            color: var(--bg);
            padding: 10px 20px;
            border-radius: 6px;
            font-family: var(--font-head);
            font-weight: 700;
            font-size: 0.9rem;
            opacity: 0;
            box-shadow: 0 4px 20px rgba(0,243,255,0.2);
        }

        /* --- GAME BOARD (Mobile First) --- */
        #board-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 10px;
        }

        #board {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            gap: 6px;
            width: 100%;
            max-width: 330px;
            aspect-ratio: 5 / 6;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .tile {
            width: 100%;
            height: 100%;
            border: 2px solid var(--border);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: var(--font-head);
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text);
            background: var(--surface);
            user-select: none;
        }

        .tile.filled { border-color: var(--text-sec); }
        .tile.correct { background: var(--correct); border-color: var(--correct); color: #000; }
        .tile.present { background: var(--present); border-color: var(--present); color: #000; }
        .tile.absent { background: var(--absent); border-color: var(--absent); }

        /* --- KEYBOARD (Mobile First) --- */
        #keyboard {
            width: 100%;
            max-width: 500px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
            margin-bottom: env(safe-area-inset-bottom, 8px);
        }

        .key-row {
            display: flex;
            justify-content: center;
            gap: 6px;
            width: 100%;
        }

        .key {
            font-family: var(--font-head);
            font-weight: 700;
            font-size: 1.1rem;
            border: none;
            border-radius: 6px;
            height: 54px;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--border);
            color: var(--text);
            cursor: pointer;
            user-select: none;
            transition: background 0.2s, transform 0.1s;
        }

        .key:active { transform: scale(0.92); }
        .key.wide { flex: 1.5; font-size: 0.85rem; letter-spacing: 0.5px; }
        .key.correct { background: var(--correct); color: #000; }
        .key.present { background: var(--present); color: #000; }
        .key.absent { background: var(--absent); color: var(--text-sec); }

        /* --- LAPTOP OPTIMIZATION (768px+) --- */
        @media (min-width: 768px) {
            #board { max-width: 400px; gap: 8px; }
            .row { gap: 8px; }
            .tile { font-size: 2.2rem; border-radius: 8px; }
            .key { height: 64px; font-size: 1.2rem; border-radius: 8px; }
            h1 { font-size: 1.8rem; }
        }

        /* --- DESKTOP OPTIMIZATION (1024px+) --- */
        @media (min-width: 1024px) {
            #board { max-width: 450px; gap: 10px; }
            .row { gap: 10px; }
            .tile { font-size: 2.5rem; border-radius: 10px; }
            .key { height: 70px; font-size: 1.3rem; border-radius: 10px; }
            header { padding: 16px 24px; }
        }
    </style>
    
    <!-- Load Prime Spirit Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <a href="https://primespirit.co.in" class="back-link">← PrimeSpirit</a>
        <h1>WORD CHALLENGE</h1>
        <button class="icon-btn" onclick="initGame()" aria-label="New Game">↻</button>
    </header>

    <div id="loading-text">Loading PrimeLab Dictionary...</div>
    <div id="toast-container"></div>

    <div id="board-container">
        <div id="board"></div>
    </div>

    <div id="keyboard"></div>

    <script>
        // ==========================================
        // 1. DICTIONARY LOADER (Fetch from JSON)
        // ==========================================
        let DICTIONARY = [];
        
        async function loadDictionary() {
            try {
                // IMPORTANT: Ensure this path matches your GitHub folder structure!
                // If HTML is in PrimeLab/ and JSON is in PrimeLab/words/dictionary.json
                const response = await fetch('prime-lab-word-game/words/dictionary.json');
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                
                // Filter: ensure exactly 5 letters, uppercase (adjust if your JSON has different lengths)
                DICTIONARY = data
                    .filter(word => typeof word === 'string' && word.length === 5)
                    .map(word => word.toUpperCase());
                    
                if (DICTIONARY.length === 0) throw new Error('No valid 5-letter words found');
                
                // Hide loading state and start game
                document.getElementById('loading-text').style.display = 'none';
                initGame();
            } catch (error) {
                console.error('Failed to load dictionary:', error);
                document.getElementById('loading-text').textContent = 'Error loading dictionary. Check file path.';
            }
        }

        const KEYBOARD_LAYOUT = [
            ['Q','W','E','R','T','Y','U','I','O','P'],
            ['A','S','D','F','G','H','J','K','L'],
            ['ENTER','Z','X','C','V','B','N','M','⌫']
        ];

        let targetWord = '';
        let currentRow = 0;
        let currentTile = 0;
        let gameOver = false;
        let guesses = [[]];

        // ==========================================
        // 2. WEB AUDIO API SOUND ENGINE (No 404s!)
        // ==========================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            
            if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.15);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'flip') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gainNode.gain.setValueAtTime(0.05, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'win') {
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.type = 'sine'; o.frequency.value = freq;
                    g.gain.setValueAtTime(0.1, now + i * 0.1);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.3);
                    o.start(now + i * 0.1); o.stop(now + i * 0.1 + 0.3);
                });
            }
        }

        // ==========================================
        // 3. GAME LOGIC
        // ==========================================
        function initGame() {
            targetWord = DICTIONARY[Math.floor(Math.random() * DICTIONARY.length)];
            currentRow = 0;
            currentTile = 0;
            gameOver = false;
            guesses = [['', '', '', '', '']];
            
            document.getElementById('board').innerHTML = '';
            document.getElementById('keyboard').innerHTML = '';
            
            createBoard();
            createKeyboard();
            console.log("PrimeLab Debug: Target word is", targetWord);
        }

        function createBoard() {
            const board = document.getElementById('board');
            for (let i = 0; i < 6; i++) {
                const row = document.createElement('div');
                row.className = 'row'; row.id = `row-${i}`;
                for (let j = 0; j < 5; j++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile'; tile.id = `tile-${i}-${j}`;
                    row.appendChild(tile);
                }
                board.appendChild(row);
            }
        }

        function createKeyboard() {
            const keyboard = document.getElementById('keyboard');
            KEYBOARD_LAYOUT.forEach(rowKeys => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'key-row';
                rowKeys.forEach(key => {
                    const btn = document.createElement('button');
                    btn.className = `key ${key.length > 1 ? 'wide' : ''}`;
                    btn.textContent = key;
                    btn.id = `key-${key}`;
                    // Use pointerdown for instant mobile response
                    btn.addEventListener('pointerdown', (e) => {
                        e.preventDefault();
                        handleInput(key);
                    });
                    rowDiv.appendChild(btn);
                });
                keyboard.appendChild(rowDiv);
            });
        }

        function handleInput(key) {
            if (gameOver) return;

            if (key === '⌫' || key === 'BACKSPACE') {
                if (currentTile > 0) {
                    currentTile--;
                    guesses[currentRow][currentTile] = '';
                    updateTile(currentRow, currentTile, '');
                    playSound('pop');
                }
                return;
            }

            if (key === 'ENTER') {
                if (currentTile === 5) {
                    submitGuess();
                } else {
                    showToast("Not enough letters");
                    shakeRow();
                    playSound('error');
                }
                return;
            }

            if (/^[A-Z]$/.test(key) && currentTile < 5) {
                guesses[currentRow][currentTile] = key;
                updateTile(currentRow, currentTile, key);
                currentTile++;
                playSound('pop');
                
                const tile = document.getElementById(`tile-${currentRow}-${currentTile-1}`);
                gsap.fromTo(tile, { scale: 0.8 }, { scale: 1, duration: 0.15, ease: "back.out(1.7)" });
            }
        }

        function updateTile(row, col, letter) {
            const tile = document.getElementById(`tile-${row}-${col}`);
            tile.textContent = letter;
            tile.classList.toggle('filled', letter !== '');
        }

        function submitGuess() {
            const guess = guesses[currentRow].join('');
            
            if (!DICTIONARY.includes(guess)) {
                showToast("Not in PrimeLab dictionary");
                shakeRow();
                playSound('error');
                return;
            }

            const targetLetters = targetWord.split('');
            const guessLetters = guess.split('');
            const result = new Array(5).fill('absent');

            // Pass 1: Correct (Green)
            for (let i = 0; i < 5; i++) {
                if (guessLetters[i] === targetLetters[i]) {
                    result[i] = 'correct';
                    targetLetters[i] = null; guessLetters[i] = null;
                }
            }

            // Pass 2: Present (Yellow)
            for (let i = 0; i < 5; i++) {
                if (guessLetters[i] !== null) {
                    const index = targetLetters.indexOf(guessLetters[i]);
                    if (index !== -1) {
                        result[i] = 'present';
                        targetLetters[index] = null;
                    }
                }
            }

            // GSAP Flip Animation & Sound
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const tile = document.getElementById(`tile-${currentRow}-${i}`);
                    const key = document.getElementById(`key-${guesses[currentRow][i]}`);
                    
                    playSound('flip');
                    
                    gsap.to(tile, {
                        rotateX: 90, duration: 0.25,
                        onComplete: () => {
                            tile.classList.add(result[i]);
                            if (key) {
                                if (result[i] === 'correct') key.className = 'key correct';
                                else if (result[i] === 'present' && !key.classList.contains('correct')) key.className = 'key present';
                                else if (result[i] === 'absent' && !key.classList.contains('correct') && !key.classList.contains('present')) key.className = 'key absent';
                            }
                            gsap.to(tile, { rotateX: 0, duration: 0.25 });
                        }
                    });
                }, i * 300);
            }

            setTimeout(() => {
                if (guess === targetWord) {
                    playSound('win');
                    showToast("Brilliant! 🎉");
                    triggerConfetti();
                    gameOver = true;
                } else if (currentRow === 5) {
                    showToast(`Game Over! Word: ${targetWord}`);
                    playSound('error');
                    gameOver = true;
                } else {
                    currentRow++;
                    currentTile = 0;
                    guesses.push(['', '', '', '', '']);
                }
            }, 1800);
        }

        function shakeRow() {
            const row = document.getElementById(`row-${currentRow}`);
            gsap.to(row, { x: -5, duration: 0.05, yoyo: true, repeat: 5, onComplete: () => gsap.set(row, { x: 0 }) });
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            container.appendChild(toast);
            
            gsap.to(toast, { opacity: 1, y: -10, duration: 0.3 });
            setTimeout(() => {
                gsap.to(toast, { opacity: 0, y: -20, duration: 0.3, onComplete: () => toast.remove() });
            }, 2000);
        }

        function triggerConfetti() {
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#00f3ff', '#00ff9d', '#ffd700', '#bc13fe']
            });
        }

        // Physical keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleInput('ENTER');
            else if (e.key === 'Backspace') handleInput('⌫');
            else handleInput(e.key.toUpperCase());
        });

        // ==========================================
        // 4. INITIALIZE
        // ==========================================
        // Start by fetching the dictionary from your JSON file
        loadDictionary();
    </script>
</body>
</html>
