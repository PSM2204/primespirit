  startGame() {
    Sound.play('move');
  },

  renderBoard() {
    const grid = document.getElementById('boardGrid');
    grid.innerHTML = '';
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const displayR = this.boardFlipped ? 7-r : r;
        const displayC = this.boardFlipped ? 7-c : c;
        const sq = document.createElement('div');
        const isLight = (displayR + displayC) % 2 === 0;
        sq.className = 'square ' + (isLight ? 'light' : 'dark');
        sq.dataset.row = displayR;
        sq.dataset.col = displayC;

        // Coordinates
        if (c === 0) {
          const coord = document.createElement('span');
          coord.className = 'coord rank';
          coord.textContent = 8 - displayR;
          sq.appendChild(coord);
        }
        if (r === 7) {
          const coord = document.createElement('span');
          coord.className = 'coord file';
          coord.textContent = CONFIG.files[displayC];
          sq.appendChild(coord);
        }

        // Last move highlight
        if (this.engine.history.length > 0) {
          const last = this.engine.history[this.engine.history.length - 1].move;
          if ((displayR===last.fr&&displayC===last.fc)||(displayR===last.tr&&displayC===last.tc)) {
            sq.classList.add('last-move');
          }
        }

        // Check highlight
        const piece = this.engine.board[displayR][displayC];
        if (piece && piece.type === 'K' && piece.color === this.engine.turn && this.engine.inCheck(this.engine.turn)) {
          sq.classList.add('check-square');
        }

        // Selected
        if (this.selectedSquare && this.selectedSquare.r===displayR && this.selectedSquare.c===displayC) {
          sq.classList.add('selected');
        }

        // Piece
        if (piece) {
          const pEl = document.createElement('span');
          pEl.className = 'piece ' + (piece.color === 'white' ? 'white-piece' : 'black-piece');
          pEl.textContent = piece.color === 'white' ? CONFIG.pieceChars[piece.type] : CONFIG.pieceCharsB[piece.type];
          sq.appendChild(pEl);
        }

        // Legal move indicators
        const isLegal = this.legalMoves.some(m => m.tr === displayR && m.tc === displayC);
        if (isLegal) {
          const target = this.engine.board[displayR][displayC];
          if (target || (this.selectedSquare && this.engine.board[this.selectedSquare.r][this.selectedSquare.c]?.type === 'P' && this.engine.ep && displayR === this.engine.ep.r && displayC === this.engine.ep.c)) {
            const ring = document.createElement('div');
            ring.className = 'legal-ring';
            sq.appendChild(ring);
          } else {
            const dot = document.createElement('div');
            dot.className = 'legal-dot';
            sq.appendChild(dot);
          }
        }

        sq.addEventListener('click', () => this.onSquareClick(displayR, displayC));
        grid.appendChild(sq);
      }
    }
  },

  onSquareClick(r, c) {
    if (this.animating) return;
    if (this.engine.isGameOver() && !this.puzzleMode) return;
    if (this.pendingPromo) return;

    // In puzzle mode, only allow moves for the side to move
    if (this.puzzleMode && this.engine.turn !== (this.currentPuzzle ? new ChessEngine().turn : this.engine.turn)) return;

    // In AI mode, only allow player moves
    if (this.gameMode === 'ai' && this.engine.turn === this.aiColor && !this.puzzleMode) return;

    const piece = this.engine.board[r][c];

    // If a piece is selected and clicking on a legal move target
    if (this.selectedSquare) {
      const legalTarget = this.legalMoves.filter(m => m.tr === r && m.tc === c);
      if (legalTarget.length > 0) {
        // Check for promotion
        if (legalTarget[0].promo) {
          // Multiple promotion options
          this.showPromotionUI(legalTarget);
          return;
        }
        this.executeMove(legalTarget[0]);
        return;
      }
    }

    // Select a new piece
    if (piece && piece.color === this.engine.turn) {
      this.selectedSquare = { r, c };
      this.legalMoves = this.engine.legalMovesFrom(r, c);
      this.renderBoard();
    } else {
      this.selectedSquare = null;
      this.legalMoves = [];
      this.renderBoard();
    }
  },

  showPromotionUI(moves) {
    const overlay = document.createElement('div');
    overlay.className = 'promo-overlay';
    overlay.id = 'promoOverlay';
    const color = this.engine.turn;
    let html = '<div class="promo-panel"><h3>PROMOTE PAWN</h3><div class="promo-options">';
    for (const pp of ['Q','R','B','N']) {
      const ch = color === 'white' ? CONFIG.pieceChars[pp] : CONFIG.pieceCharsB[pp];
      html += `<div class="promo-opt" onclick="App.completePromotion('${pp}')">${ch}</div>`;
    }
    html += '</div></div>';
    overlay.innerHTML = html;
    document.body.appendChild(overlay);
    this.pendingPromo = moves;
  },

  completePromotion(pieceType) {
    const overlay = document.getElementById('promoOverlay');
    if (overlay) overlay.remove();
    const m = this.pendingPromo.find(m => m.promo === pieceType);
    this.pendingPromo = null;
    if (m) this.executeMove(m);
  },

  executeMove(m) {
    this.selectedSquare = null;
    this.legalMoves = [];

    const result = this.engine.makeMove(m);
    Sound.play(result.isCastle ? 'castle' : result.inCheck ? 'check' : result.captured ? 'capture' : 'move');
    Sound.vibrate(result.captured ? 50 : 20);

    // Track achievements data
    this.lastGameData = this.lastGameData || {};
    if (result.isCastle) this.lastGameData.didCastle = true;
    if (result.isEP) this.lastGameData.didEP = true;
    if (result.isPromo) { this.lastGameData.didPromo = true; if (m.promo === 'N') this.lastGameData.didUnderPromo = true; }

    this.renderBoard();
    this.updateUI();
    this.saveGame();

    // Puzzle mode check
    if (this.puzzleMode) {
      this.checkPuzzleSolution(m);
      return;
    }

    // Check game end
    if (this.engine.isGameOver()) {
      this.handleGameEnd();
      return;
    }

    // AI move
    if (this.gameMode === 'ai' && this.engine.turn === this.aiColor) {
      this.makeAIMove();
    }
  },

  checkPuzzleSolution(m) {
    const puzzle = this.currentPuzzle;
    if (!puzzle) return;

    const sol = puzzle.solution;
    const bar = document.getElementById('statusBar');

    if (sol.length === 0) {
      // No specific solution - just let them play
      bar.innerHTML = '<div style="color:var(--accent)">Keep exploring this position...</div>';
      return;
    }

    const isCorrect = sol.some(s => s.fr===m.fr && s.fc===m.fc && s.tr===m.tr && s.tc===m.tc);
    const resultDiv = document.createElement('div');

    if (isCorrect) {
      resultDiv.className = 'puzzle-result correct';
      resultDiv.textContent = '✓ Correct! Well done!';
      Sound.play('victory');
      this.stats.puzzlesSolved = (this.stats.puzzlesSolved||0) + 1;
      this.addXP(15);
      if (this.dailyMode) {
        this.stats.dailyStreak = (this.stats.dailyStreak||0) + 1;
        this.stats.lastDaily = new Date().toDateString();
      }
    } else {
      resultDiv.className = 'puzzle-result wrong';
      resultDiv.textContent = '✗ Not the best move. Try again!';
      Sound.play('fail');
      this.stats.puzzleAttempts = (this.stats.puzzleAttempts||0) + 1;
    }
    this.stats.puzzleAttempts = (this.stats.puzzleAttempts||0) + 1;
    this.saveStats();

    bar.innerHTML = '';
    bar.appendChild(resultDiv);

    // Show next puzzle button
    setTimeout(() => {
      const btn = document.createElement('button');
      btn.className = 'end-btn primary';
      btn.textContent = 'Next Puzzle →';
      btn.onclick = () => {
        if (this.dailyMode) {
          this.startDaily();
        } else {
          this.currentPuzzle = Puzzles.getRandom();
          this.loadPuzzle(this.currentPuzzle);
        }
      };
      bar.appendChild(btn);
    }, 1000);
  },

  makeAIMove() {
    document.getElementById('aiThinking').classList.remove('hidden');
    const delay = CONFIG.aiDelays[this.aiDifficulty] || 400;

    setTimeout(() => {
      const m = AI.getBestMove(this.engine, this.aiDifficulty);
      document.getElementById('aiThinking').classList.add('hidden');
      if (m) this.executeMove(m);
    }, delay);
  },

  handleGameEnd() {
    const state = this.engine.state;
    const result = this.engine.result;
    let title, subtitle, color;

    if (state === 'checkmate') {
      const winner = this.engine.turn === 'white' ? 'Black' : 'White';
      title = 'CHECKMATE';
      subtitle = `${winner} wins!`;
      color = 'var(--accent)';
      Sound.play('checkmate');
      setTimeout(() => Sound.play('victory'), 500);

      this.stats.checkmates = (this.stats.checkmates||0) + 1;
      const totalMoves = this.engine.fullmove;

      if (this.gameMode === 'ai') {
        const playerWon = (this.aiColor === 'white' && result === '0-1') || (this.aiColor === 'black' && result === '1-0');
        if (playerWon) {
          this.stats.wins++;
          this.stats.winStreak++;
          this.stats.maxWinStreak = Math.max(this.stats.maxWinStreak, this.stats.winStreak);
          if (totalMoves < this.stats.fastestMate) this.stats.fastestMate = totalMoves;
          if (this.aiDifficulty >= 5) this.lastGameData.beatExpert = true;
          this.lastGameData.quickMate = totalMoves < 20;
          this.addXP(30 + this.aiDifficulty * 10);
        } else {
          this.stats.losses++;
          this.stats.winStreak = 0;
        }
      } else {
        this.addXP(10);
      }
    } else {
      title = 'DRAW';
      if (state === 'stalemate') subtitle = 'By stalemate';
      else subtitle = 'By agreement';
      color = 'var(--accent2)';
      Sound.play('move');
      if (this.gameMode === 'ai') { this.stats.draws++; this.stats.winStreak = 0; }
    }

    this.stats.gamesPlayed++;
    this.stats.totalMoves += this.engine.history.length;
    Achievements.check(this.stats, this.lastGameData);
    this.saveStats();
    this.lastGameData = {};

    this.showEndScreen(title, subtitle, color);
  },

  showEndScreen(title, subtitle, color) {
    const overlay = document.createElement('div');
    overlay.className = 'end-overlay';
    overlay.id = 'endOverlay';
    overlay.innerHTML = `<div class="end-panel">
      <h2 style="color:${color}">${title}</h2>
      <div class="end-sub">${subtitle}</div>
      <div class="end-buttons">
        <button class="end-btn primary" onclick="App.closeEnd();App.initGame()">New Game</button>
        <button class="end-btn" onclick="App.closeEnd();App.startReplay()">Replay Game</button>
        <button class="end-btn" onclick="App.closeEnd();App.initGame()">Rematch</button>
        <button class="end-btn" onclick="App.exportPGN()">Export PGN</button>
        <button class="end-btn" onclick="App.closeEnd();App.showMenu()">Main Menu</button>
      </div>
    </div>`;
    document.body.appendChild(overlay);
  },

  closeEnd() {
    const el = document.getElementById('endOverlay');
    if (el) el.remove();
  },

  updateUI() {
    const e = this.engine;

    // Status bar
    const bar = document.getElementById('statusBar');
    if (!this.puzzleMode) {
      if (e.state === 'checkmate') bar.innerHTML = '<span style="color:var(--danger)">CHECKMATE</span>';
      else if (e.state === 'stalemate') bar.innerHTML = '<span style="color:var(--accent2)">STALEMATE</span>';
      else if (e.state === 'draw') bar.innerHTML = '<span style="color:var(--accent2)">DRAW</span>';
      else if (e.state === 'check') bar.innerHTML = '<span style="color:var(--danger)">CHECK!</span>';
      else bar.innerHTML = `<span>${e.turn === 'white' ? 'White' : 'Black'} to move</span>`;
    }

    // Player names
    const wName = this.gameMode === 'ai' ? (this.aiColor === 'white' ? 'AI (Level '+this.aiDifficulty+')' : 'You') : 'White';
    const bName = this.gameMode === 'ai' ? (this.aiColor === 'black' ? 'AI (Level '+this.aiDifficulty+')' : 'You') : 'Black';
    document.getElementById('whiteName').textContent = wName;
    document.getElementById('blackName').textContent = bName;

    // Active player
    document.getElementById('whiteCard').classList.toggle('active', e.turn === 'white');
    document.getElementById('blackCard').classList.toggle('active', e.turn === 'black');

    // Move count
    document.getElementById('moveCountLabel').textContent = 'Move ' + e.fullmove;

    // Game mode label
    if (!this.puzzleMode) {
      document.getElementById('gameModeLabel').textContent = this.gameMode === 'ai' ? `vs AI Lv${this.aiDifficulty}` : 'Local PvP';
    }

    // Move history
    const ml = document.getElementById('moveList');
    ml.innerHTML = '';
    for (let i = 0; i < e.history.length; i += 2) {
      const moveNum = Math.floor(i/2) + 1;
      const row = document.createElement('div');
      row.className = 'move-row';
      row.innerHTML = `<span class="move-num">${moveNum}.</span>`;
      const wSan = document.createElement('span');
      wSan.className = 'move-san' + (i === e.history.length - 1 ? ' last' : '');
      wSan.textContent = e.history[i].san;
      row.appendChild(wSan);
      if (i+1 < e.history.length) {
        const bSan = document.createElement('span');
        bSan.className = 'move-san' + (i+1 === e.history.length - 1 ? ' last' : '');
        bSan.textContent = e.history[i+1].san;
        row.appendChild(bSan);
      }
      ml.appendChild(row);
    }
    ml.scrollTop = ml.scrollHeight;

    // Captured pieces
    const cap = e.getCapturedPieces();
    document.getElementById('capturedWhite').innerHTML = cap.white.map(t =>
      `<span class="piece-captured">${CONFIG.pieceChars[t]}</span>`).join('');
    document.getElementById('capturedBlack').innerHTML = cap.black.map(t =>
      `<span class="piece-captured">${CONFIG.pieceCharsB[t]}</span>`).join('');

    // Opening
    const opening = Openings.identify(e.history.map(h => h.move));
    if (opening && e.history.length > 0 && e.history.length <= 12) {
      document.getElementById('gameModeLabel').textContent = opening;
    }

    // Undo button
    const undoBtn = document.getElementById('undoBtn');
    if (undoBtn) undoBtn.disabled = e.history.length === 0 || (this.gameMode === 'ai' && e.turn === this.aiColor);
  },

  // Timer
  startTimer() {
    this.stopTimer();
    this.updateTimerDisplay();
    this.timerInterval = setInterval(() => {
      if (this.engine.isGameOver()) { this.stopTimer(); return; }
      const turn = this.engine.turn;
      this.timers[turn]--;
      if (this.timers[turn] <= 0) {
        this.timers[turn] = 0;
        this.handleTimeout(turn);
      }
      this.updateTimerDisplay();
    }, 1000);
  },

  stopTimer() {
    if (this.timerInterval) { clearInterval(this.timerInterval); this.timerInterval = null; }
  },

  updateTimerDisplay() {
    const fmt = (s) => {
      if (!s || s <= 0) return '--:--';
      const m = Math.floor(s/60);
      const sec = s%60;
      return m + ':' + (sec<10?'0':'') + sec;
    };
    const wt = document.getElementById('whiteTimer');
    const bt = document.getElementById('blackTimer');
    wt.textContent = fmt(this.timers.white);
    bt.textContent = fmt(this.timers.black);
    wt.className = 'timer-text' + (this.timers.white <= 30 ? (this.timers.white <= 10 ? ' critical' : ' low') : '');
    bt.className = 'timer-text' + (this.timers.black <= 30 ? (this.timers.black <= 10 ? ' critical' : ' low') : '');
  },

  handleTimeout(side) {
    this.engine.state = 'draw';
    this.engine.result = side === 'white' ? '0-1' : '1-0';
    // Check if opponent has sufficient mating material
    const opponent = side === 'white' ? 'black' : 'white';
    if (this.engine.isInsufficientMat()) {
      this.engine.state = 'draw';
      this.engine.result = '1/2-1/2';
    }
    const winner = side === 'white' ? 'Black' : 'White';
    const title = 'TIME OUT';
    const subtitle = `${winner} wins on time!`;
    Sound.play('fail');
    this.showEndScreen(title, subtitle, 'var(--warn)');
    this.stats.gamesPlayed++;
    if (this.gameMode === 'ai') {
      const playerSide = this.aiColor === 'white' ? 'black' : 'white';
      if (side === playerSide) { this.stats.losses++; this.stats.winStreak=0; }
      else { this.stats.wins++; this.stats.winStreak++; this.stats.maxWinStreak=Math.max(this.stats.maxWinStreak,this.stats.winStreak); }
    }
    this.saveStats();
  },

  // Game controls
  undoMove() {
    if (this.engine.history.length === 0) return;
    if (this.gameMode === 'ai') {
      // Undo both player and AI move
      this.engine.undoMove();
      if (this.engine.history.length > 0 && this.engine.turn === this.aiColor) {
        this.engine.undoMove();
      }
    } else {
      this.engine.undoMove();
    }
    this.selectedSquare = null;
    this.legalMoves = [];
    this.renderBoard();
    this.updateUI();
    this.saveGame();
  },

  resign() {
    if (this.engine.isGameOver()) return;
    if (!confirm('Are you sure you want to resign?')) return;
    const winner = this.engine.turn === 'white' ? 'Black' : 'White';
    this.engine.state = 'checkmate';
    this.engine.result = this.engine.turn === 'white' ? '0-1' : '1-0';
    this.stats.gamesPlayed++;
    if (this.gameMode === 'ai') {
      const playerSide = this.aiColor === 'white' ? 'black' : 'white';
      if (this.engine.turn === playerSide) { this.stats.losses++; this.stats.winStreak=0; }
      else { this.stats.wins++; this.stats.winStreak++; }
    }
    this.saveStats();
    this.showEndScreen('RESIGNED', `${winner} wins`, 'var(--warn)');
  },

  offerDraw() {
    if (this.engine.isGameOver()) return;
    if (this.gameMode === 'pvp') {
      if (confirm('Accept draw?')) {
        this.engine.state = 'draw';
        this.engine.result = '1/2-1/2';
        this.stats.gamesPlayed++;
        this.stats.draws++;
        this.saveStats();
        this.showEndScreen('DRAW', 'By agreement', 'var(--accent2)');
      }
    } else {
      // AI accepts draw in some cases
      const e = this.engine;
      const pcs = [];
      for(let r=0;r<8;r++)for(let c=0;c<8;c++){if(e.board[r][c])pcs.push(e.board[r][c]);}
      if (pcs.length <= 4 || e.halfmove >= 40) {
        this.engine.state = 'draw';
        this.engine.result = '1/2-1/2';
        this.stats.gamesPlayed++;
        this.stats.draws++;
        this.saveStats();
        this.showEndScreen('DRAW', 'AI accepts draw', 'var(--accent2)');
      } else {
        alert('AI declines the draw offer.');
      }
    }
  },

  flipBoard() {
    this.boardFlipped = !this.boardFlipped;
    this.renderBoard();
  },

  toggle3D() {
    this.is3D = !this.is3D;
    const cont = document.getElementById('boardContainer');
    cont.classList.toggle('board-3d', this.is3D);
    cont.classList.toggle('board-2d', !this.is3D);
  },

  backToMenu() {
    this.stopTimer();
    if (this.replayInterval) { clearInterval(this.replayInterval); this.replayInterval = null; }
    if (!this.engine.isGameOver() && this.engine.history.length > 0) {
      this.saveGame();
    }
    this.showMenu();
  },

  saveGame() {
    if (this.puzzleMode) return;
    Store.set('savedGame', {
      fen: this.engine.toFEN(),
      gameMode: this.gameMode,
      aiDifficulty: this.aiDifficulty,
      aiColor: this.aiColor,
      timeControl: this.timeControl,
      timers: this.timers
    });
  },

  // PGN
  exportPGN() {
    let pgn = '[Event "Prime Spirit Chess"]\n';
    pgn += '[Site "primespirit.co.in"]\n';
    pgn += '[Date "' + new Date().toISOString().slice(0,10) + '"]\n';
    pgn += '[White "' + (this.gameMode==='ai'?(this.aiColor==='white'?'AI Level '+this.aiDifficulty:'Player'):'White') + '"]\n';
    pgn += '[Black "' + (this.gameMode==='ai'?(this.aiColor==='black'?'AI Level '+this.aiDifficulty:'Player'):'Black') + '"]\n';
    pgn += '[Result "' + (this.engine.result || '*') + '"]\n\n';

    for (let i = 0; i < this.engine.history.length; i++) {
      if (i % 2 === 0) pgn += (Math.floor(i/2)+1) + '. ';
      pgn += this.engine.history[i].san + ' ';
    }
    pgn += (this.engine.result || '*');

    // Copy to clipboard
    if (navigator.clipboard) {
      navigator.clipboard.writeText(pgn).then(() => alert('PGN copied to clipboard!'));
    } else {
      const ta = document.createElement('textarea');
      ta.value = pgn;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      alert('PGN copied to clipboard!');
    }
  },

  // Replay
  startReplay() {
    this.mode = 'replay';
    this.replayMoves = this.engine.history.map(h => h.move);
    this.replayIndex = 0;
    this.replayPlaying = false;

    // Reset engine to start
    this.engine = new ChessEngine();
    this.boardFlipped = false;

    document.getElementById('replayControls').classList.remove('hidden');
    const slider = document.getElementById('replaySlider');
    slider.max = this.replayMoves.length;
    slider.value = 0;

    this.renderBoard();
    this.updateUI();
  },

  replayFirst() {
    this.engine = new ChessEngine();
    this.replayIndex = 0;
    document.getElementById('replaySlider').value = 0;
    this.renderBoard();
  },
  replayPrev() {
    if (this.replayIndex > 0) {
      this.engine = new ChessEngine();
      this.replayIndex--;
      for (let i = 0; i < this.replayIndex; i++) this.engine.makeMove(this.replayMoves[i]);
      document.getElementById('replaySlider').value = this.replayIndex;
      this.renderBoard();
    }
  },
  replayNext() {
    if (this.replayIndex < this.replayMoves.length) {
      this.engine.makeMove(this.replayMoves[this.replayIndex]);
      this.replayIndex++;
      document.getElementById('replaySlider').value = this.replayIndex;
      this.renderBoard();
    }
  },
  replayLast() {
    while (this.replayIndex < this.replayMoves.length) {
      this.engine.makeMove(this.replayMoves[this.replayIndex]);
      this.replayIndex++;
    }
    document.getElementById('replaySlider').value = this.replayIndex;
    this.renderBoard();
  },
  replayTo(idx) {
    this.engine = new ChessEngine();
    this.replayIndex = parseInt(idx);
    for (let i = 0; i < this.replayIndex; i++) this.engine.makeMove(this.replayMoves[i]);
    this.renderBoard();
  },
  replayToggle() {
    this.replayPlaying = !this.replayPlaying;
    document.getElementById('replayPlayBtn').textContent = this.replayPlaying ? '⏸' : '▶';
    if (this.replayPlaying) {
      this.replayInterval = setInterval(() => {
        if (this.replayIndex >= this.replayMoves.length) {
          this.replayPlaying = false;
          clearInterval(this.replayInterval);
          document.getElementById('replayPlayBtn').textContent = '▶';
          return;
        }
        this.replayNext();
      }, 800);
    } else {
      clearInterval(this.replayInterval);
    }
  },

  // Stats
  showStats() {
    const btns = document.getElementById('mainMenuBtns');
    const area = document.getElementById('statsArea');
    btns.classList.add('hidden');
    area.classList.remove('hidden');

    const s = this.stats;
    const wr = s.gamesPlayed > 0 ? Math.round(s.wins/s.gamesPlayed*100) : 0;
    const level = Math.floor(this.xp/100)+1;

    let html = '<button class="back-btn" onclick="App.backToMainMenu()">← Back</button>';
    html += '<h3 style="font-family:var(--font1);color:var(--accent);letter-spacing:2px;margin:14px 0 10px;font-size:14px">STATISTICS</h3>';
    html += '<div class="stats-grid">';
    html += `<div class="stat-card"><div class="stat-val">${s.gamesPlayed}</div><div class="stat-label">Games</div></div>`;
    html += `<div class="stat-card"><div class="stat-val">${s.wins}</div><div class="stat-label">Wins</div></div>`;
    html += `<div class="stat-card"><div class="stat-val">${s.losses}</div><div class="stat-label">Losses</div></div>`;
    html += `<div class="stat-card"><div class="stat-val">${s.draws}</div><div class="stat-label">Draws</div></div>`;
    html += `<div class="stat-card"><div class="stat-val">${wr}%</div><div class="stat-label">Win Rate</div></div>`;
    html += `<div class="stat-card"><div class="stat-val">${s.maxWinStreak||0}</div><div class="stat-label">Best Streak</div></div>`;
    html += `<div class="stat-card"><div class="stat-val">${s.puzzlesSolved||0}</div><div class="stat-label">Puzzles Solved</div></div>`;
    html += `<div class="stat-card"><div class="stat-val">${s.checkmates||0}</div><div class="stat-label">Checkmates</div></div>`;
    html += `<div class="stat-card"><div class="stat-val">${s.dailyStreak||0}</div><div class="stat-label">Daily Streak</div></div>`;
    html += `<div class="stat-card"><div class="stat-val">${s.fastestMate<999?s.fastestMate:'—'}</div><div class="stat-label">Fastest Mate</div></div>`;
    html += `<div class="stat-card"><div class="stat-val">${level}</div><div class="stat-label">Level</div></div>`;
    html += `<div class="stat-card"><div class="stat-val">${this.xp}</div><div class="stat-label">Total XP</div></div>`;
    html += '</div>';

    // Achievements
    html += '<h3 style="font-family:var(--font1);color:var(--accent2);letter-spacing:2px;margin:18px 0 10px;font-size:14px">ACHIEVEMENTS</h3>';
    html += '<div class="achievement-grid">';
    Achievements.defs.forEach(a => {
      const unlocked = (s.unlocked||[]).includes(a.id);
      html += `<div class="achievement ${unlocked?'unlocked':''}" title="${a.desc}">
        <div class="ach-icon">${a.icon}</div>
        <div class="ach-name">${a.name}</div>
      </div>`;
    });
    html += '</div>';

    area.innerHTML = html;
  },

  // Settings
  showSettingsMenu() {
    const btns = document.getElementById('mainMenuBtns');
    const area = document.getElementById('settingsArea');
    btns.classList.add('hidden');
    area.classList.remove('hidden');
    this.renderSettings(area);
  },

  showSettingsInGame() {
    const overlay = document.createElement('div');
    overlay.className = 'settings-overlay';
    overlay.id = 'settingsOverlay';
    overlay.innerHTML = '<div class="settings-panel" id="settingsPanel"></div>';
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    document.body.appendChild(overlay);
    this.renderSettings(document.getElementById('settingsPanel'), true);
  },

  renderSettings(container, inGame) {
    let html = '';
    if (!inGame) html += '<button class="back-btn" onclick="App.backToMainMenu()">← Back</button>';
    html += '<h3 style="font-family:var(--font1);color:var(--accent);letter-spacing:2px;margin:14px 0 10px;font-size:14px">SETTINGS</h3>';

    // Toggles
    html += '<div class="setting-row"><span>Sound Effects</span><div class="toggle '+(this.settings.sound?'on':'')+'" onclick="App.toggleSetting(\'sound\',this)"></div></div>';
    html += '<div class="setting-row"><span>Vibration</span><div class="toggle '+(this.settings.vibration?'on':'')+'" onclick="App.toggleSetting(\'vibration\',this)"></div></div>';
    html += '<div class="setting-row"><span>Animations</span><div class="toggle '+(this.settings.animOn?'on':'')+'" onclick="App.toggleSetting(\'animOn\',this)"></div></div>';
    html += '<div class="setting-row"><span>Reduced Motion</span><div class="toggle '+(this.settings.reducedMotion?'on':'')+'" onclick="App.toggleSetting(\'reducedMotion\',this)"></div></div>';
    html += '<div class="setting-row"><span>High Contrast</span><div class="toggle '+(this.settings.highContrast?'on':'')+'" onclick="App.toggleSetting(\'highContrast\',this)"></div></div>';

    // Themes
    html += '<div style="margin-top:16px"><label style="font-size:12px;color:var(--text2);letter-spacing:1px;text-transform:uppercase">Board Theme</label>';
    html += '<div class="theme-grid">';
    const themes = ['default','midnight','aquamarine','neon','butter','royal','wood'];
    themes.forEach(t => {
      html += `<div class="theme-opt ${(this.settings.theme||'default')===t?'active':''}" onclick="App.setTheme('${t}')">${t.charAt(0).toUpperCase()+t.slice(1)}</div>`;
    });
    html += '</div></div>';

    // Reset
    html += '<div style="margin-top:20px;display:flex;gap:8px">';
    html += '<button class="ctrl-btn danger" onclick="if(confirm(\'Reset all stats and progress?\')){localStorage.clear();location.reload();}">Reset All Data</button>';
    html += '</div>';

    container.innerHTML = html;
    if (inGame) {
      const closeBtn = document.createElement('button');
      closeBtn.className = 'end-btn primary';
      closeBtn.textContent = 'Close';
      closeBtn.style.marginTop = '16px';
      closeBtn.onclick = () => document.getElementById('settingsOverlay')?.remove();
      container.appendChild(closeBtn);
    }
  },

  toggleSetting(key, el) {
    this.settings[key] = !this.settings[key];
    el.classList.toggle('on');
    this.applySettings();
    this.saveSettings();
    Sound.enabled = this.settings.sound;
  },

  setTheme(theme) {
    this.settings.theme = theme;
    this.applySettings();
    this.saveSettings();
    // Refresh settings display
    const area = document.getElementById('settingsArea');
    if (!area.classList.contains('hidden')) this.renderSettings(area);
    const panel = document.getElementById('settingsPanel');
    if (panel) this.renderSettings(panel, true);
  }
};

// ============================================================
// BOARD ROTATION (3D CAMERA)
// ============================================================
(() => {
  let isDragging = false;
  let startX = 0;
  let rotZ = 0;

  const wrap = document.getElementById('boardWrap');
  if (!wrap) return;

  const onStart = (x, y) => {
    if (App.animating) return;
    isDragging = true;
    startX = x;
  };

  const onMove = (x) => {
    if (!isDragging) return;
    const dx = x - startX;
    rotZ += dx * 0.3;
    rotZ = Math.max(-45, Math.min(45, rotZ));
    startX = x;
    const cont = document.getElementById('boardContainer');
    if (App.is3D) {
      cont.style.setProperty('--board-rot', rotZ + 'deg');
    }
  };

  const onEnd = () => { isDragging = false; };

  wrap.addEventListener('mousedown', (e) => {
    if (e.target.closest('.square') && e.target.closest('.square').querySelector('.piece')) return;
    onStart(e.clientX, e.clientY);
  });
  window.addEventListener('mousemove', (e) => onMove(e.clientX));
  window.addEventListener('mouseup', onEnd);

  wrap.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      const tgt = e.target.closest('.square');
      if (tgt && tgt.querySelector('.piece')) return;
      onStart(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: true });
  window.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1) onMove(e.touches[0].clientX);
  }, { passive: true });
  window.addEventListener('touchend', onEnd);
})();

// ============================================================
// KEYBOARD SHORTCUTS
// ============================================================
document.addEventListener('keydown', (e) => {
  if (App.mode === 'playing' || App.mode === 'replay') {
    switch(e.key) {
      case 'ArrowLeft': if(App.mode==='replay')App.replayPrev(); break;
      case 'ArrowRight': if(App.mode==='replay')App.replayNext(); break;
      case 'f': App.flipBoard(); break;
      case '3': App.toggle3D(); break;
      case 'z': if(e.ctrlKey){e.preventDefault();App.undoMove();} break;
    }
  }
});

// ============================================================
// VISIBILITY API (pause timers when tab hidden)
// ============================================================
document.addEventListener('visibilitychange', () => {
  if (document.hidden && App.timerInterval) {
    App._timerWasPaused = true;
    App.stopTimer();
  } else if (!document.hidden && App._timerWasPaused && !App.engine?.isGameOver()) {
    App._timerWasPaused = false;
    App.startTimer();
  }
});

// ============================================================
// INITIALIZE
// ============================================================
document.addEventListener('DOMContentLoaded', () => App.init());
</script>
