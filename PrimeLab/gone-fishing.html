<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gone Fishing - PrimeLab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #1E90FF 50%, #00008B 100%);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .game-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            color: white;
            padding: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            animation: wave 2s ease-in-out infinite;
        }

        @keyframes wave {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            color: white;
            font-weight: bold;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.8em;
            display: block;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .category-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .category-display h2 {
            font-size: 1.3em;
        }

        .river {
            position: relative;
            height: 500px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(5px);
            border: 3px solid rgba(255,255,255,0.3);
        }

        .fish {
            position: absolute;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 15px 25px;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s;
            white-space: nowrap;
            animation: swim 8s linear infinite;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .fish::before {
            content: "🐟";
            font-size: 1.5em;
        }

        .fish:hover {
            transform: scale(1.1);
        }

        .fish.correct {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            animation: catch 0.3s ease-out;
        }

        .fish.wrong {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            animation: escape 0.5s ease-out;
        }

        @keyframes swim {
            from { transform: translateX(-200px); }
            to { transform: translateX(calc(100vw + 200px)); }
        }

        @keyframes catch {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.3) rotate(10deg); }
            100% { transform: scale(0) rotate(360deg); opacity: 0; }
        }

        @keyframes escape {
            0% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-30px) rotate(-5deg); }
            50% { transform: translateY(0) rotate(5deg); }
            75% { transform: translateY(-20px) rotate(-3deg); }
            100% { transform: translateY(-100px) rotate(0deg); opacity: 0; }
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            font-size: 1em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            background: white;
            color: #1E90FF;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .start-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px 50px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            z-index: 1000;
            display: none;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            from { transform: translate(-50%, -50%) scale(0); }
            to { transform: translate(-50%, -50%) scale(1); }
        }

        .message.show {
            display: block;
        }

        .message h2 {
            color: #f5576c;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .message p {
            color: #666;
            margin-bottom: 20px;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
        }

        .overlay.show {
            display: block;
        }

        .lives {
            display: flex;
            gap: 5px;
        }

        .heart {
            color: #ff6b6b;
            font-size: 1.5em;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .combo {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 15px 25px;
            border-radius: 15px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: none;
        }

        .combo.show {
            display: block;
            animation: comboPop 0.3s ease-out;
        }

        @keyframes comboPop {
            0% { transform: scale(0) rotate(-10deg); }
            50% { transform: scale(1.2) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        @media (max-width: 600px) {
            header h1 { font-size: 1.8em; }
            .stats-bar { flex-direction: column; gap: 10px; }
            .river { height: 400px; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <header>
            <h1> Gone Fishing</h1>
            <p>Test your selective attention!</p>
        </header>

        <div class="stats-bar">
            <div class="stat">
                <span class="stat-value" id="score">0</span>
                <span class="stat-label">Score</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="level">1</span>
                <span class="stat-label">Level</span>
            </div>
            <div class="stat">
                <div class="lives" id="lives">
                    <span class="heart">❤️</span>
                    <span class="heart">❤️</span>
                    <span class="heart">❤️</span>
                </div>
                <span class="stat-label">Lives</span>
            </div>
        </div>

        <div class="category-display">
            <h2>🎯 Catch only: <span id="currentCategory">Physics Terms</span></h2>
        </div>

        <div class="river" id="river"></div>

        <div class="controls">
            <button class="start-btn" onclick="startGame()">🎮 Start Game</button>
            <button onclick="changeCategory()">🔄 Change Category</button>
            <button onclick="pauseGame()">⏸️ Pause</button>
        </div>
    </div>

    <div class="combo" id="combo">
        🔥 Combo x<span id="comboCount">0</span>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="message" id="message">
        <h2 id="messageTitle">Game Over!</h2>
        <p id="messageText">Your score: 0</p>
        <button onclick="closeMessage()">Play Again</button>
    </div>

    <script>
        // Game Data
        const categories = {
            "Physics Terms": {
                correct: ["Velocity", "Acceleration", "Momentum", "Energy", "Force", "Gravity", "Friction", "Mass", "Power", "Work", "Inertia", "Torque", "Pressure", "Density", "Frequency"],
                wrong: ["Cell", "Molecule", "Equation", "Novel", "Painting", "Democracy", "Algorithm", "Revenue", "Sonnet", "Volcano"]
            },
            "Chemistry Terms": {
                correct: ["Atom", "Molecule", "Element", "Compound", "Reaction", "Catalyst", "Solution", "Acid", "Base", "Ion", "Electron", "Proton", "Neutron", "Bond", "Oxidation"],
                wrong: ["Velocity", "Novel", "Painting", "Democracy", "Sonnet", "Algorithm", "Revenue", "Volcano", "Mountain", "Ocean"]
            },
            "Biology Terms": {
                correct: ["Cell", "DNA", "Protein", "Organism", "Evolution", "Species", "Gene", "Chromosome", "Mitosis", "Photosynthesis", "Enzyme", "Metabolism", "Organ", "Tissue", "Ecosystem"],
                wrong: ["Velocity", "Atom", "Equation", "Novel", "Painting", "Democracy", "Algorithm", "Revenue", "Sonnet", "Volcano"]
            },
            "Math Terms": {
                correct: ["Equation", "Variable", "Function", "Derivative", "Integral", "Matrix", "Theorem", "Algorithm", "Geometry", "Algebra", "Calculus", "Probability", "Statistics", "Vector", "Scalar"],
                wrong: ["Cell", "Atom", "Novel", "Painting", "Democracy", "Revenue", "Sonnet", "Volcano", "Mountain", "Ocean"]
            },
            "Literature Terms": {
                correct: ["Novel", "Poetry", "Metaphor", "Simile", "Sonnet", "Prose", "Narrative", "Character", "Plot", "Theme", "Symbolism", "Irony", "Alliteration", "Rhyme", "Verse"],
                wrong: ["Velocity", "Atom", "Cell", "Equation", "Democracy", "Revenue", "Volcano", "Mountain", "Ocean", "Algorithm"]
            }
        };

        // Game State
        let gameState = {
            isPlaying: false,
            score: 0,
            lives: 3,
            level: 1,
            combo: 0,
            currentCategory: "Physics Terms",
            fishInterval: null,
            spawnRate: 2000,
            speed: 8
        };

        const river = document.getElementById('river');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const levelEl = document.getElementById('level');
        const comboEl = document.getElementById('combo');
        const comboCountEl = document.getElementById('comboCount');
        const messageEl = document.getElementById('message');
        const overlayEl = document.getElementById('overlay');
        const categoryEl = document.getElementById('currentCategory');

        function startGame() {
            if (gameState.isPlaying) return;
            
            gameState.isPlaying = true;
            gameState.score = 0;
            gameState.lives = 3;
            gameState.level = 1;
            gameState.combo = 0;
            gameState.spawnRate = 2000;
            gameState.speed = 8;
            
            updateStats();
            river.innerHTML = '';
            spawnFish();
            
            gameState.fishInterval = setInterval(() => {
                if (gameState.isPlaying) {
                    spawnFish();
                    // Increase difficulty
                    if (gameState.score % 5 === 0 && gameState.spawnRate > 800) {
                        gameState.spawnRate -= 100;
                        gameState.speed += 0.5;
                        gameState.level++;
                        updateStats();
                    }
                }
            }, gameState.spawnRate);
        }

        function spawnFish() {
            const fish = document.createElement('div');
            fish.className = 'fish';
            
            const isCorrect = Math.random() > 0.5;
            const category = categories[gameState.currentCategory];
            const words = isCorrect ? category.correct : category.wrong;
            const word = words[Math.floor(Math.random() * words.length)];
            
            fish.textContent = word;
            fish.dataset.correct = isCorrect;
            fish.dataset.word = word;
            
            // Random vertical position
            const maxY = river.offsetHeight - 60;
            fish.style.top = Math.random() * maxY + 'px';
            fish.style.left = '-200px';
            
            // Animation duration based on speed
            const duration = 10 - gameState.speed;
            fish.style.animationDuration = duration + 's';
            
            fish.addEventListener('click', () => catchFish(fish));
            
            river.appendChild(fish);
            
            // Remove fish after it passes
            setTimeout(() => {
                if (fish.parentNode && !fish.dataset.caught) {
                    missFish(fish);
                }
            }, duration * 1000);
        }

        function catchFish(fish) {
            if (fish.dataset.caught) return;
            fish.dataset.caught = 'true';
            
            const isCorrect = fish.dataset.correct === 'true';
            
            if (isCorrect) {
                // Correct catch!
                fish.classList.add('correct');
                gameState.combo++;
                gameState.score += 10 * gameState.combo;
                
                if (gameState.combo >= 3) {
                    showCombo();
                }
                
                playSound('correct');
            } else {
                // Wrong catch!
                fish.classList.add('wrong');
                gameState.lives--;
                gameState.combo = 0;
                comboEl.classList.remove('show');
                playSound('wrong');
                
                if (gameState.lives <= 0) {
                    gameOver();
                }
            }
            
            updateStats();
            
            setTimeout(() => {
                if (fish.parentNode) {
                    fish.remove();
                }
            }, 500);
        }

        function missFish(fish) {
            if (fish.dataset.correct === 'true' && !fish.dataset.caught) {
                // Missed a correct fish
                gameState.lives--;
                gameState.combo = 0;
                comboEl.classList.remove('show');
                playSound('miss');
                
                if (gameState.lives <= 0) {
                    gameOver();
                }
                updateStats();
            }
            
            if (fish.parentNode) {
                fish.remove();
            }
        }

        function showCombo() {
            comboCountEl.textContent = gameState.combo;
            comboEl.classList.add('show');
            setTimeout(() => {
                comboEl.classList.remove('show');
            }, 2000);
        }

        function updateStats() {
            scoreEl.textContent = gameState.score;
            levelEl.textContent = gameState.level;
            
            let hearts = '';
            for (let i = 0; i < gameState.lives; i++) {
                hearts += '<span class="heart">❤️</span>';
            }
            livesEl.innerHTML = hearts;
        }

        function changeCategory() {
            const cats = Object.keys(categories);
            const currentIndex = cats.indexOf(gameState.currentCategory);
            const nextIndex = (currentIndex + 1) % cats.length;
            gameState.currentCategory = cats[nextIndex];
            categoryEl.textContent = gameState.currentCategory;
            playSound('click');
        }

        function pauseGame() {
            if (!gameState.isPlaying) return;
            gameState.isPlaying = false;
            clearInterval(gameState.fishInterval);
            showMessage('Paused', 'Game is paused. Ready to continue?');
        }

        function gameOver() {
            gameState.isPlaying = false;
            clearInterval(gameState.fishInterval);
            showMessage('Game Over!', `Final Score: ${gameState.score}\nLevel Reached: ${gameState.level}\nBest Combo: x${gameState.combo}`);
        }

        function showMessage(title, text) {
            document.getElementById('messageTitle').textContent = title;
            document.getElementById('messageText').textContent = text;
            overlayEl.classList.add('show');
            messageEl.classList.add('show');
        }

        function closeMessage() {
            overlayEl.classList.remove('show');
            messageEl.classList.remove('show');
            river.innerHTML = '';
            startGame();
        }

        function playSound(type) {
            // Visual feedback instead of audio (can be enhanced with actual sounds)
            const colors = {
                correct: '#4facfe',
                wrong: '#fa709a',
                miss: '#fee140',
                click: '#667eea'
            };
            
            document.body.style.background = `linear-gradient(180deg, ${colors[type]} 0%, #1E90FF 50%, #00008B 100%)`;
            setTimeout(() => {
                document.body.style.background = 'linear-gradient(180deg, #87CEEB 0%, #1E90FF 50%, #00008B 100%)';
            }, 200);
        }

        // Prevent default touch behaviors
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
