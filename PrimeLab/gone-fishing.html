<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gone Fishing - PrimeLab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { 
    width: 100%; 
    height: 100%; 
    overflow: hidden; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(180deg, #0a1628 0%, #1a3a6c 50%, #0d2240 100%);
    color: white;
    touch-action: manipulation;
  }
  
  .game-container {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 12px;
    overflow: hidden;
  }
  
  header {
    text-align: center;
    padding: 8px 0;
    flex-shrink: 0;
  }
  
  header h1 {
    font-size: 1.6em;
    margin-bottom: 4px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
  }
  
  header p {
    font-size: 0.85em;
    opacity: 0.9;
  }
  
  .stats-bar {
    display: flex;
    justify-content: space-around;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border-radius: 12px;
    padding: 10px;
    margin: 8px 0;
    flex-shrink: 0;
  }
  
  .stat { text-align: center; }
  .stat-value { font-size: 1.4em; font-weight: bold; display: block; }
  .stat-label { font-size: 0.75em; opacity: 0.8; }
  
  .category-display {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 10px 20px;
    border-radius: 25px;
    text-align: center;
    margin: 8px 0;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    flex-shrink: 0;
  }
  
  .category-display h2 { font-size: 1.1em; }
  
  .river {
    position: relative;
    flex: 1;
    background: rgba(255,255,255,0.05);
    border-radius: 16px;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.2);
    margin: 8px 0;
    min-height: 0;
  }
  
  .fish {
    position: absolute;
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    padding: 10px 18px;
    border-radius: 25px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    white-space: nowrap;
    font-size: 0.9em;
    display: flex;
    align-items: center;
    gap: 8px;
    user-select: none;
  }
  
  .fish::before { content: "🐟"; font-size: 1.2em; }
  .fish:active { transform: scale(0.95); }
  
  .fish.correct {
    background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    animation: catch 0.3s ease-out forwards;
  }
  
  .fish.wrong {
    background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
    animation: escape 0.5s ease-out forwards;
  }
  
  @keyframes catch {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(0); opacity: 0; }
  }
  
  @keyframes escape {
    0% { transform: translateY(0); }
    100% { transform: translateY(-80px); opacity: 0; }
  }
  
  .controls {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-shrink: 0;
    padding: 8px 0;
  }
  
  button {
    padding: 10px 20px;
    font-size: 0.9em;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    background: white;
    color: #1a3a6c;
    font-weight: bold;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    transition: all 0.2s;
  }
  
  button:active { transform: scale(0.95); }
  
  .start-btn {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
  }
  
  .combo {
    position: fixed;
    top: 60px;
    right: 10px;
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    padding: 8px 15px;
    border-radius: 12px;
    font-weight: bold;
    font-size: 0.9em;
    display: none;
    z-index: 100;
  }
  
  .combo.show { display: block; animation: popIn 0.3s ease-out; }
  
  @keyframes popIn {
    0% { transform: scale(0); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  
  .message {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    color: #333;
    padding: 25px 40px;
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    z-index: 1000;
    display: none;
  }
  
  .message.show { display: block; }
  .message h2 { color: #f5576c; font-size: 1.8em; margin-bottom: 10px; }
  .message p { margin-bottom: 15px; white-space: pre-line; }
  
  .overlay-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 999;
    display: none;
  }
  
  .overlay-bg.show { display: block; }
  
  .lives { display: flex; gap: 4px; justify-content: center; }
  .heart { font-size: 1.3em; }
  
  .progress-bar {
    background: rgba(255,255,255,0.2);
    border-radius: 10px;
    padding: 4px 12px;
    margin-top: 8px;
    font-size: 0.75em;
  }
</style>
</head>
<body>
  <div class="game-container">
    <header>
      <h1>🎣 Gone Fishing</h1>
      <p>Test your selective attention!</p>
    </header>

    <div class="stats-bar">
      <div class="stat">
        <span class="stat-value" id="score">0</span>
        <span class="stat-label">Score</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="level">1</span>
        <span class="stat-label">Level</span>
      </div>
      <div class="stat">
        <div class="lives" id="lives">
          <span class="heart">❤️</span>
          <span class="heart">❤️</span>
          <span class="heart">❤️</span>
        </div>
        <span class="stat-label">Lives</span>
      </div>
    </div>

    <div class="category-display">
      <h2>🎯 Catch only: <span id="currentCategory">Physics Terms</span></h2>
      <div class="progress-bar">Words remaining: <span id="wordsRemaining">15</span>/15</div>
    </div>

    <div class="river" id="river"></div>

    <div class="controls">
      <button class="start-btn" onclick="startGame()">🎮 Start</button>
      <button onclick="changeCategory()"> Category</button>
      <button onclick="pauseGame()">⏸️</button>
    </div>
  </div>

  <div class="combo" id="combo"> x<span id="comboCount">0</span></div>
  <div class="overlay-bg" id="overlayBg"></div>
  <div class="message" id="message">
    <h2 id="messageTitle">Game Over!</h2>
    <p id="messageText">Score: 0</p>
    <button onclick="closeMessage()">Play Again</button>
  </div>

<script>
const allCategories = {
  "Physics Terms": {
    correct: ["Velocity","Acceleration","Momentum","Energy","Force","Gravity","Friction","Mass","Power","Work","Inertia","Torque","Pressure","Density","Frequency"],
    wrong: ["Cell","Molecule","Equation","Novel","Painting","Democracy","Algorithm","Revenue","Sonnet","Volcano"]
  },
  "Chemistry Terms": {
    correct: ["Atom","Molecule","Element","Compound","Reaction","Catalyst","Solution","Acid","Base","Ion","Electron","Proton","Neutron","Bond","Oxidation"],
    wrong: ["Velocity","Novel","Painting","Democracy","Sonnet","Algorithm","Revenue","Volcano","Mountain","Ocean"]
  },
  "Biology Terms": {
    correct: ["Cell","DNA","Protein","Organism","Evolution","Species","Gene","Chromosome","Mitosis","Photosynthesis","Enzyme","Metabolism","Organ","Tissue","Ecosystem"],
    wrong: ["Velocity","Atom","Equation","Novel","Painting","Democracy","Algorithm","Revenue","Sonnet","Volcano"]
  },
  "Math Terms": {
    correct: ["Equation","Variable","Function","Derivative","Integral","Matrix","Theorem","Algorithm","Geometry","Algebra","Calculus","Probability","Statistics","Vector","Scalar"],
    wrong: ["Cell","Atom","Novel","Painting","Democracy","Revenue","Sonnet","Volcano","Mountain","Ocean"]
  },
  "Literature Terms": {
    correct: ["Novel","Poetry","Metaphor","Simile","Sonnet","Prose","Narrative","Character","Plot","Theme","Symbolism","Irony","Alliteration","Rhyme","Verse"],
    wrong: ["Velocity","Atom","Cell","Equation","Democracy","Revenue","Volcano","Mountain","Ocean","Algorithm"]
  }
};

let gameState = {
  isPlaying: false,
  score: 0,
  lives: 3,
  level: 1,
  combo: 0,
  currentCategory: "Physics Terms",
  fishInterval: null,
  spawnRate: 2000,
  speed: 8,
  // Word pools (shuffled, no repeats)
  correctPool: [],
  wrongPool: [],
  usedWords: new Set()
};

const river = document.getElementById('river');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const levelEl = document.getElementById('level');
const comboEl = document.getElementById('combo');
const comboCountEl = document.getElementById('comboCount');
const messageEl = document.getElementById('message');
const overlayBg = document.getElementById('overlayBg');
const categoryEl = document.getElementById('currentCategory');
const wordsRemainingEl = document.getElementById('wordsRemaining');

// Shuffle array using Fisher-Yates algorithm
function shuffleArray(array) {
  const shuffled = [...array];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
}

// Initialize word pools for current category
function initWordPools() {
  const category = allCategories[gameState.currentCategory];
  // Shuffle and create pools
  gameState.correctPool = shuffleArray(category.correct);
  gameState.wrongPool = shuffleArray(category.wrong);
  gameState.usedWords.clear();
  updateWordsRemaining();
}

// Get next word from pool (no repeats)
function getNextWord(isCorrect) {
  const pool = isCorrect ? gameState.correctPool : gameState.wrongPool;
  
  // Find unused word from pool
  for (let word of pool) {
    const key = gameState.currentCategory + '_' + word;
    if (!gameState.usedWords.has(key)) {
      gameState.usedWords.add(key);
      updateWordsRemaining();
      return word;
    }
  }
  
  // If all words used, reshuffle and start over
  if (isCorrect) {
    gameState.correctPool = shuffleArray(allCategories[gameState.currentCategory].correct);
  } else {
    gameState.wrongPool = shuffleArray(allCategories[gameState.currentCategory].wrong);
  }
  
  // Return first word from reshuffled pool
  const word = pool[0];
  const key = gameState.currentCategory + '_' + word;
  gameState.usedWords.add(key);
  updateWordsRemaining();
  return word;
}

function updateWordsRemaining() {
  const category = allCategories[gameState.currentCategory];
  const totalWords = category.correct.length;
  let usedCount = 0;
  
  for (let word of category.correct) {
    const key = gameState.currentCategory + '_' + word;
    if (gameState.usedWords.has(key)) usedCount++;
  }
  
  const remaining = totalWords - usedCount;
  wordsRemainingEl.textContent = remaining;
  
  // Show message when all words caught
  if (remaining === 0 && gameState.isPlaying) {
    setTimeout(() => {
      if (gameState.isPlaying) {
        gameState.isPlaying = false;
        clearInterval(gameState.fishInterval);
        showMessage('🎉 Category Complete!', `You caught all ${totalWords} ${gameState.currentCategory}!\nFinal Score: ${gameState.score}`);
      }
    }, 2000);
  }
}

function startGame() {
  if (gameState.isPlaying) return;
  gameState.isPlaying = true;
  gameState.score = 0;
  gameState.lives = 3;
  gameState.level = 1;
  gameState.combo = 0;
  gameState.spawnRate = 2000;
  gameState.speed = 8;
  initWordPools();
  updateStats();
  river.innerHTML = '';
  spawnFish();
  gameState.fishInterval = setInterval(() => {
    if (gameState.isPlaying) {
      spawnFish();
      if (gameState.score % 5 === 0 && gameState.spawnRate > 800) {
        gameState.spawnRate -= 100;
        gameState.speed += 0.5;
        gameState.level++;
        updateStats();
      }
    }
  }, gameState.spawnRate);
}

function spawnFish() {
  const fish = document.createElement('div');
  fish.className = 'fish';
  const isCorrect = Math.random() > 0.5;
  const word = getNextWord(isCorrect);
  fish.textContent = word;
  fish.dataset.correct = isCorrect;
  fish.dataset.word = word;
  const maxY = river.offsetHeight - 50;
  fish.style.top = Math.random() * maxY + 'px';
  fish.style.left = '-150px';
  const duration = Math.max(3, 10 - gameState.speed);
  fish.style.transition = `left ${duration}s linear`;
  fish.addEventListener('click', () => catchFish(fish));
  fish.addEventListener('touchstart', (e) => { e.preventDefault(); catchFish(fish); });
  river.appendChild(fish);
  setTimeout(() => { fish.style.left = (river.offsetWidth + 150) + 'px'; }, 50);
  setTimeout(() => {
    if (fish.parentNode && !fish.dataset.caught) missFish(fish);
  }, duration * 1000);
}

function catchFish(fish) {
  if (fish.dataset.caught) return;
  fish.dataset.caught = 'true';
  const isCorrect = fish.dataset.correct === 'true';
  if (isCorrect) {
    fish.classList.add('correct');
    gameState.combo++;
    gameState.score += 10 * gameState.combo;
    if (gameState.combo >= 3) showCombo();
  } else {
    fish.classList.add('wrong');
    gameState.lives--;
    gameState.combo = 0;
    comboEl.classList.remove('show');
    if (gameState.lives <= 0) gameOver();
  }
  updateStats();
  setTimeout(() => { if (fish.parentNode) fish.remove(); }, 500);
}

function missFish(fish) {
  if (fish.dataset.correct === 'true' && !fish.dataset.caught) {
    gameState.lives--;
    gameState.combo = 0;
    comboEl.classList.remove('show');
    if (gameState.lives <= 0) gameOver();
    updateStats();
  }
  if (fish.parentNode) fish.remove();
}

function showCombo() {
  comboCountEl.textContent = gameState.combo;
  comboEl.classList.add('show');
  setTimeout(() => comboEl.classList.remove('show'), 2000);
}

function updateStats() {
  scoreEl.textContent = gameState.score;
  levelEl.textContent = gameState.level;
  let hearts = '';
  for (let i = 0; i < gameState.lives; i++) hearts += '<span class="heart">❤️</span>';
  livesEl.innerHTML = hearts;
}

function changeCategory() {
  const cats = Object.keys(allCategories);
  const idx = cats.indexOf(gameState.currentCategory);
  gameState.currentCategory = cats[(idx + 1) % cats.length];
  categoryEl.textContent = gameState.currentCategory;
  // Reset pools for new category
  if (gameState.isPlaying) {
    initWordPools();
  }
}

function pauseGame() {
  if (!gameState.isPlaying) return;
  gameState.isPlaying = false;
  clearInterval(gameState.fishInterval);
  showMessage('Paused', 'Game paused. Ready to continue?');
}

function gameOver() {
  gameState.isPlaying = false;
  clearInterval(gameState.fishInterval);
  showMessage('Game Over!', `Final Score: ${gameState.score}\nLevel: ${gameState.level}`);
}

function showMessage(title, text) {
  document.getElementById('messageTitle').textContent = title;
  document.getElementById('messageText').textContent = text;
  overlayBg.classList.add('show');
  messageEl.classList.add('show');
}

function closeMessage() {
  overlayBg.classList.remove('show');
  messageEl.classList.remove('show');
  river.innerHTML = '';
  startGame();
}
</script>
</body>
</html>
