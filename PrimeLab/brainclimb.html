<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BrainClimb – Logic Hill Climber | PrimeLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Exo 2',sans-serif;background:#0a0e1a;color:#e8e6e3;overflow:hidden;width:100vw;height:100vh}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100}
#start-screen{background:linear-gradient(135deg,#0a0e1a 0%,#1a1040 50%,#0a1628 100%);flex-direction:column;overflow-y:auto}
.start-content{text-align:center;max-width:860px;padding:20px;animation:fadeIn .8s ease}
.game-title{font-family:'Orbitron',sans-serif;font-size:clamp(2.2rem,6vw,4.2rem);font-weight:900;letter-spacing:.1em;color:#fff;text-shadow:0 0 40px rgba(0,229,160,.25)}
.game-title span{color:#00e5a0}
.subtitle{font-size:1.1rem;color:#6a6d75;margin-top:6px;letter-spacing:.3em;text-transform:uppercase}
.diff-info{margin:18px 0 28px;font-size:.85rem;color:#444;letter-spacing:.15em}
.vehicle-grid{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:28px}
.vehicle-card{background:rgba(255,255,255,.03);border:2px solid rgba(255,255,255,.07);border-radius:14px;padding:16px 12px;width:148px;cursor:pointer;transition:all .3s ease;position:relative}
.vehicle-card:hover{border-color:rgba(0,229,160,.3);transform:translateY(-4px);background:rgba(0,229,160,.04)}
.vehicle-card.selected{border-color:#00e5a0;background:rgba(0,229,160,.08);box-shadow:0 0 25px rgba(0,229,160,.18)}
.vehicle-icon{font-size:2.4rem;margin-bottom:6px}
.vehicle-name{font-family:'Orbitron',sans-serif;font-size:.7rem;font-weight:700;margin-bottom:10px;color:#fff;letter-spacing:.05em}
.stat-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:.6rem;color:#777;text-transform:uppercase;letter-spacing:.08em}
.stat-row span:first-child{width:26px;text-align:right}
.stat-bg{flex:1;height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.stat-fill{height:100%;border-radius:3px;transition:width .4s}
.vehicle-desc{font-size:.62rem;color:#555;margin-top:9px;line-height:1.35}
.btn-primary{font-family:'Orbitron',sans-serif;font-size:.95rem;font-weight:700;padding:14px 44px;border:none;border-radius:8px;cursor:pointer;background:linear-gradient(135deg,#00e5a0,#00b8d4);color:#0a0e1a;letter-spacing:.15em;transition:all .3s;text-transform:uppercase}
.btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,229,160,.3)}
.btn-primary:disabled{opacity:.35;cursor:not-allowed}
#game-canvas{position:fixed;inset:0;z-index:1}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:14px 20px;background:linear-gradient(180deg,rgba(10,14,26,.85) 0%,transparent 100%);z-index:50;pointer-events:none}
.hud-l,.hud-c,.hud-r{display:flex;flex-direction:column;gap:3px}
.hud-label{font-family:'Orbitron',sans-serif;font-size:.55rem;color:#444;letter-spacing:.2em;text-transform:uppercase}
.fuel-wrap{display:flex;align-items:center;gap:8px}
.fuel-bg{width:clamp(90px,18vw,160px);height:10px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden}
.fuel-bar{width:100%;height:100%;background:linear-gradient(90deg,#00e5a0,#7bed9f);border-radius:5px;transition:width .3s}
.hud-val{font-family:'Orbitron',sans-serif;font-size:1.05rem;font-weight:700;color:#fff}
.goal-sub{font-size:.65rem;color:#444;margin-left:2px}
#quiz-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:200;animation:fadeIn .25s}
#quiz-modal{background:#141825;border:1px solid rgba(0,229,160,.18);border-radius:18px;padding:28px 26px;max-width:500px;width:92%;animation:scaleIn .3s ease}
.quiz-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.quiz-cat{font-family:'Orbitron',sans-serif;font-size:.65rem;background:rgba(0,229,160,.13);color:#00e5a0;padding:4px 14px;border-radius:20px;letter-spacing:.12em}
.quiz-timer{position:relative;width:46px;height:46px}
.quiz-timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.t-bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:3}
.t-fill{fill:none;stroke:#00e5a0;stroke-width:3;stroke-linecap:round;stroke-dasharray:100.53;stroke-dashoffset:0;transition:stroke .3s,stroke-dashoffset .15s linear}
.t-fill.warn{stroke:#ffa502}
.t-fill.danger{stroke:#ff4757}
#timer-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-size:.72rem;font-weight:700}
.quiz-q{font-size:1.08rem;line-height:1.65;margin-bottom:18px;color:#e8e6e3;min-height:50px}
.quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.q-opt{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:13px 10px;font-family:'Exo 2',sans-serif;font-size:.92rem;color:#e8e6e3;cursor:pointer;transition:all .2s;text-align:center}
.q-opt:hover:not(.off){border-color:#00e5a0;background:rgba(0,229,160,.08)}
.q-opt.right{border-color:#00e5a0;background:rgba(0,229,160,.18);color:#00e5a0;pointer-events:none}
.q-opt.wrong{border-color:#ff4757;background:rgba(255,71,87,.18);color:#ff4757;pointer-events:none}
.q-opt.off{pointer-events:none;opacity:.45}
.quiz-fb{margin-top:14px;padding:12px;border-radius:8px;font-size:.82rem;line-height:1.5;animation:slideUp .3s ease}
.quiz-fb.ok{background:rgba(0,229,160,.08);border-left:3px solid #00e5a0}
.quiz-fb.nope{background:rgba(255,71,87,.08);border-left:3px solid #ff4757}
#fb-title{font-weight:700;margin-bottom:4px}
#fb-explain{color:#888;font-size:.78rem}
.end-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:150}
.end-box{text-align:center;animation:scaleIn .5s ease}
.end-box h2{font-family:'Orbitron',sans-serif;font-size:clamp(1.8rem,5vw,3rem);margin-bottom:22px;letter-spacing:.08em}
.end-box h2.red{color:#ff4757}
.end-box h2.green{color:#00e5a0;text-shadow:0 0 30px rgba(0,229,160,.4)}
.stats{display:flex;flex-direction:column;gap:10px;margin-bottom:28px;min-width:260px}
.stats .row{display:flex;justify-content:space-between;padding:10px 18px;background:rgba(255,255,255,.04);border-radius:8px;font-size:.9rem}
.stats .row span:last-child{font-family:'Orbitron',sans-serif;font-weight:700;color:#00e5a0}
#gameover-screen{background:rgba(10,14,26,.92)}
#victory-screen{background:rgba(10,14,26,.92)}
#mobile-controls{position:fixed;bottom:28px;left:0;right:0;display:flex;justify-content:space-between;padding:0 24px;z-index:60;pointer-events:none}
.m-btn{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:rgba(255,255,255,.45);pointer-events:auto;user-select:none;-webkit-user-select:none;transition:all .15s}
.m-btn:active,.m-btn.on{background:rgba(0,229,160,.25);border-color:#00e5a0;color:#fff}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){.vehicle-card{width:110px;padding:12px 8px}.vehicle-icon{font-size:1.8rem}.vehicle-name{font-size:.6rem}.quiz-opts{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- ===== START SCREEN ===== -->
<div id="start-screen" class="screen">
  <div class="start-content">
    <h1 class="game-title">BRAIN<span>CLIMB</span></h1>
    <p class="subtitle">Logic Meets Adventure</p>
    <p class="diff-info">Class 9–12 &bull; Math &bull; Physics &bull; Logic &bull; Critical Thinking</p>
    <div id="vehicle-grid" class="vehicle-grid"></div>
    <button id="btn-start" class="btn-primary" disabled>Select a Vehicle</button>
  </div>
</div>

<!-- ===== CANVAS ===== -->
<canvas id="game-canvas"></canvas>

<!-- ===== HUD ===== -->
<div id="hud" class="hidden">
  <div class="hud-l">
    <span class="hud-label">Fuel</span>
    <div class="fuel-wrap">
      <div class="fuel-bg"><div id="fuel-bar" class="fuel-bar"></div></div>
      <span id="fuel-text" class="hud-val">100</span>
    </div>
  </div>
  <div class="hud-c">
    <span class="hud-label">Score</span>
    <span id="score-val" class="hud-val">0</span>
  </div>
  <div class="hud-r">
    <span class="hud-label">Distance</span>
    <div><span id="dist-val" class="hud-val">0</span><span class="goal-sub">/ 30 000 m</span></div>
  </div>
</div>

<!-- ===== QUIZ ===== -->
<div id="quiz-overlay" class="hidden">
  <div id="quiz-modal">
    <div class="quiz-head">
      <span id="q-cat" class="quiz-cat"></span>
      <div class="quiz-timer">
        <svg viewBox="0 0 36 36"><circle class="t-bg" cx="18" cy="18" r="16"/><circle id="t-circle" class="t-fill" cx="18" cy="18" r="16"/></svg>
        <span id="timer-text">15</span>
      </div>
    </div>
    <p id="q-text" class="quiz-q"></p>
    <div id="q-opts" class="quiz-opts"></div>
    <div id="quiz-fb" class="quiz-fb hidden"></div>
  </div>
</div>

<!-- ===== GAME OVER ===== -->
<div id="gameover-screen" class="end-screen hidden">
  <div class="end-box">
    <h2 class="red">GAME OVER</h2>
    <div class="stats">
      <div class="row"><span>Distance</span><span id="go-dist">0 m</span></div>
      <div class="row"><span>Score</span><span id="go-score">0</span></div>
      <div class="row"><span>Correct</span><span id="go-corr">0 / 0</span></div>
    </div>
    <button id="btn-go" class="btn-primary">Try Again</button>
  </div>
</div>

<!-- ===== VICTORY ===== -->
<div id="victory-screen" class="end-screen hidden">
  <div class="end-box">
    <h2 class="green">SUMMIT REACHED!</h2>
    <div class="stats">
      <div class="row"><span>Final Score</span><span id="vic-score">0</span></div>
      <div class="row"><span>Correct</span><span id="vic-corr">0 / 0</span></div>
      <div class="row"><span>Fuel Left</span><span id="vic-fuel">0%</span></div>
    </div>
    <button id="btn-vic" class="btn-primary">Play Again</button>
  </div>
</div>

<!-- ===== MOBILE CONTROLS ===== -->
<div id="mobile-controls" class="hidden">
  <div id="btn-brake" class="m-btn">&#9664;</div>
  <div id="btn-gas" class="m-btn">&#9654;</div>
</div>

<script>
(function(){
'use strict';

/* ===================== CONFIG ===================== */
const C={
  GOAL:30000, FUEL_START:100, FUEL_MAX:100,
  DRAIN_BASE:.3, DRAIN_ACCEL:1.5,
  FUEL_CORRECT:25, FUEL_WRONG:-12, FUEL_CAN:15,
  CP_DIST:1500, CAN_DIST:420,
  GRAVITY:340, SCORE_DIST:.5, SCORE_CORR:500, SCORE_CAN:100
};

/* ===================== QUESTIONS ===================== */
const Q=[
{q:"Solve: 2x + 6 = 20. What is x?",o:["5","7","8","14"],a:1,cat:"Algebra",d:"easy",e:"2x+6=20 → 2x=14 → x = 7"},
{q:"Hypotenuse of a right triangle with legs 5 cm and 12 cm?",o:["13 cm","17 cm","10 cm","15 cm"],a:0,cat:"Geometry",d:"easy",e:"√(5²+12²)=√(25+144)=√169 = 13 cm"},
{q:"What is sin(30°)?",o:["√3/2","1/2","1","0"],a:1,cat:"Trigonometry",d:"easy",e:"sin 30° = 1/2 is a standard trig value"},
{q:"In F = ma, what does 'a' represent?",o:["Area","Acceleration","Amplitude","Angle"],a:1,cat:"Physics",d:"easy",e:"'a' is acceleration — rate of change of velocity"},
{q:"Factorize: x² − 9",o:["(x−3)(x−3)","(x+3)(x+3)","(x+3)(x−3)","Cannot factor"],a:2,cat:"Algebra",d:"easy",e:"Difference of squares: a²−b² = (a+b)(a−b)"},
{q:"Atomic number of Carbon?",o:["4","6","8","12"],a:1,cat:"Chemistry",d:"easy",e:"Carbon has 6 protons → atomic number = 6"},
{q:"Next in sequence: 2, 6, 12, 20, __?",o:["24","28","30","32"],a:2,cat:"Logic",d:"medium",e:"Differences: 4,6,8,10 → 20+10 = 30. Pattern: n(n+1)"},
{q:"A bat and ball cost ₹110. The bat costs ₹100 more than the ball. Ball costs?",o:["₹10","₹5","₹1","₹15"],a:1,cat:"Critical Thinking",d:"medium",e:"x + (x+100) = 110 → 2x=10 → ball = ₹5"},
{q:"What is tan(45°)?",o:["0","1/2","1","√3"],a:2,cat:"Trigonometry",d:"easy",e:"tan 45° = sin 45°/cos 45° = 1"},
{q:"SI unit of force?",o:["Joule","Watt","Newton","Pascal"],a:2,cat:"Physics",d:"easy",e:"Force is measured in Newtons (N)"},
{q:"5 machines make 5 widgets in 5 min. How long for 100 machines to make 100 widgets?",o:["100 min","5 min","20 min","50 min"],a:1,cat:"Critical Thinking",d:"medium",e:"Each machine makes 1 widget in 5 min. 100 machines → 100 widgets in 5 min"},
{q:"Sum of interior angles of a hexagon?",o:["540°","720°","900°","1080°"],a:1,cat:"Geometry",d:"medium",e:"(n−2)×180° = (6−2)×180° = 720°"},
{q:"pH of pure water?",o:["0","1","7","14"],a:2,cat:"Chemistry",d:"easy",e:"Pure water is neutral with pH = 7"},
{q:"Fibonacci: 1, 1, 2, 3, 5, 8, __?",o:["10","11","13","15"],a:2,cat:"Logic",d:"easy",e:"Each number = sum of two before it: 5+8 = 13"},
{q:"d/dx (x²) = ?",o:["x","2x","x²","2x²"],a:1,cat:"Calculus",d:"medium",e:"Power rule: d/dx(xⁿ) = nxⁿ⁻¹, so 2x"},
{q:"sin²θ + cos²θ = ?",o:["0","sin 2θ","1","2"],a:2,cat:"Trigonometry",d:"medium",e:"Pythagorean identity: always equals 1"},
{q:"3 books on a shelf — how many arrangements?",o:["3","6","9","12"],a:1,cat:"Permutation",d:"medium",e:"3! = 3×2×1 = 6"},
{q:"All roses are flowers. Some flowers fade quickly. Do all roses fade quickly?",o:["Yes","No","Sometimes","Only in summer"],a:1,cat:"Logic",d:"medium",e:"'Some flowers' ≠ 'all flowers' — we can't conclude this."},
{q:"d/dx (sin x) = ?",o:["−sin x","cos x","−cos x","tan x"],a:1,cat:"Calculus",d:"medium",e:"Fundamental derivative: d/dx(sin x) = cos x"},
{q:"10 people shake hands once each. Total handshakes?",o:["20","45","90","100"],a:1,cat:"Combinatorics",d:"hard",e:"C(10,2) = 10×9/2 = 45"},
{q:"∫ 2x dx = ?",o:["2x²+C","x²+C","x+C","2+C"],a:1,cat:"Calculus",d:"medium",e:"∫2x dx = 2·x²/2 + C = x² + C"},
{q:"Car from rest at 2 m/s². Velocity after 10 s?",o:["5 m/s","10 m/s","20 m/s","12 m/s"],a:2,cat:"Physics",d:"easy",e:"v = u + at = 0 + 2×10 = 20 m/s"},
{q:"Fair die — P(number > 4)?",o:["1/6","1/3","1/2","2/3"],a:1,cat:"Probability",d:"medium",e:"Numbers >4 are 5,6 → P = 2/6 = 1/3"},
{q:"Area of circle with radius 7 cm? (π=22/7)",o:["44 cm²","154 cm²","88 cm²","148 cm²"],a:1,cat:"Geometry",d:"easy",e:"πr² = (22/7)×49 = 154 cm²"},
{q:"How many lines of symmetry does a circle have?",o:["1","4","360","Infinite"],a:3,cat:"Geometry",d:"easy",e:"Any diameter is a line of symmetry → infinite"},
{q:"If log₂(x) = 5, what is x?",o:["10","25","32","64"],a:2,cat:"Algebra",d:"medium",e:"log₂(x)=5 means 2⁵ = x → x = 32"},
{q:"√144 + √81 = ?",o:["19","21","23","25"],a:1,cat:"Algebra",d:"easy",e:"√144=12, √81=9 → 12+9 = 21"},
{q:"V=12V, R=4Ω. Current I?",o:["3 A","4 A","8 A","48 A"],a:0,cat:"Physics",d:"medium",e:"Ohm's Law: I = V/R = 12/4 = 3 A"},
{q:"lim(x→0) sin(x)/x = ?",o:["0","1","∞","Does not exist"],a:1,cat:"Calculus",d:"hard",e:"Fundamental limit in calculus = 1"},
{q:"Two coins tossed. P(exactly one head)?",o:["1/4","1/2","3/4","1/3"],a:1,cat:"Probability",d:"medium",e:"HT, TH out of HH,HT,TH,TT → 2/4 = 1/2"},
{q:"2⁰ + 3⁰ + 4⁰ = ?",o:["0","1","3","9"],a:2,cat:"Algebra",d:"easy",e:"Anything⁰ = 1 → 1+1+1 = 3"},
{q:"Which law says 'every action has equal & opposite reaction'?",o:["Newton's 1st","Newton's 2nd","Newton's 3rd","Gravitation"],a:2,cat:"Physics",d:"easy",e:"Newton's Third Law of Motion"},
{q:"Next prime after 29?",o:["30","31","33","37"],a:1,cat:"Number Theory",d:"medium",e:"31 is prime. 30=2·3·5, 33=3·11"},
{q:"Right triangle with one angle 30°. Third angle?",o:["30°","45°","60°","90°"],a:2,cat:"Geometry",d:"easy",e:"180° − 90° − 30° = 60°"},
{q:"Work equals?",o:["Force × Time","Force × Distance","Mass × Velocity","Power × Time"],a:1,cat:"Physics",d:"easy",e:"Work = Force × Displacement (W = F·d)"},
{q:"How many prime numbers between 1 and 20?",o:["6","7","8","9"],a:2,cat:"Number Theory",d:"medium",e:"2,3,5,7,11,13,17,19 → 8 primes"}
];

/* ===================== VEHICLES ===================== */
const V=[
  {id:'rocket',name:'Rocket Bike',icon:'🚀',pow:300,spd:380,fCap:70,dRate:1.3,tr:.7,col:'#ff4757',desc:'Blazing fast but fuel-hungry'},
  {id:'tank',name:'Crawler Tank',icon:'🛡️',pow:200,spd:220,fCap:130,dRate:.6,tr:1.0,col:'#2ed573',desc:'Slow and steady, massive tank'},
  {id:'hover',name:'Hover Pod',icon:'🛸',pow:260,spd:300,fCap:90,dRate:.9,tr:.85,col:'#70a1ff',desc:'Smooth ride, balanced stats'},
  {id:'spider',name:'Spider Mech',icon:'🕷️',pow:230,spd:260,fCap:100,dRate:.8,tr:1.2,col:'#a55eea',desc:'Unstoppable on steep terrain'},
  {id:'steam',name:'Steam Engine',icon:'🚂',pow:250,spd:280,fCap:100,dRate:1.0,tr:.9,col:'#ffa502',desc:'Reliable all-rounder'}
];

/* ===================== AUDIO ===================== */
let actx=null,eOsc=null,eGain=null,eOn=false;
function aInit(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)()}
function tone(f,d,t='sine',v=.13){if(!actx)return;try{const o=actx.createOscillator(),g=actx.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d+.01)}catch(e){}}
function sndOK(){tone(523,.1);setTimeout(()=>tone(659,.1),80);setTimeout(()=>tone(784,.18),160)}
function sndBad(){tone(200,.22,'sawtooth',.08);setTimeout(()=>tone(155,.28,'sawtooth',.08),140)}
function sndFuel(){tone(600,.07,'sine',.1);setTimeout(()=>tone(900,.1,'sine',.1),55)}
function sndCP(){tone(440,.09);setTimeout(()=>tone(554,.09),70);setTimeout(()=>tone(659,.14),140)}
function engStart(){if(!actx||eOn)return;eOsc=actx.createOscillator();eGain=actx.createGain();eOsc.type='sawtooth';eOsc.frequency.value=55;eGain.gain.value=0;eOsc.connect(eGain);eGain.connect(actx.destination);eOsc.start();eOn=true}
function engUpdate(spd,acc){if(!eOn||!eOsc)return;eOsc.frequency.setTargetAtTime(55+Math.abs(spd)*.15,actx.currentTime,.08);eGain.gain.setTargetAtTime(acc?.06:.012,actx.currentTime,.08)}
function engStop(){if(!eOn)return;try{eGain.gain.setTargetAtTime(0,actx.currentTime,.1)}catch(e){}eOn=false}

/* ===================== TERRAIN ===================== */
function tH(x){
  const r=Math.min(x/500,1),d=Math.min(1+x/7000,2.8);
  let y=0;
  y+=Math.sin(x*.0018)*110*r;
  y+=Math.sin(x*.004+1.3)*55*r;
  y+=Math.sin(x*.009+.7)*35*d*r;
  y+=Math.sin(x*.018+2.1)*18*d*r;
  y+=Math.cos(x*.003+3)*70*r;
  return y;
}
function tY(x,by){return by-tH(x)}
function tA(x,by){const d=2,y1=tY(x-d,by),y2=tY(x+d,by);return Math.atan2(y2-y1,2*d)}

/* ===================== PARTICLES ===================== */
const parts=[];
function pSpawn(x,y,vx,vy,life,sz,col){if(parts.length>250)return;parts.push({x,y,vx,vy,life,ml:life,sz,col})}
function pUpdate(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=80*dt;p.life-=dt;if(p.life<=0)parts.splice(i,1)}}
function pDraw(ctx,cam){for(const p of parts){const sx=p.x-cam.x+cam.hw,sy=p.y-cam.y+cam.hh,a=p.life/p.ml;ctx.globalAlpha=a*.65;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(sx,sy,p.sz*a,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}

/* ===================== GAME ===================== */
const G={
  cv:null,cx:null,W:0,H:0,
  state:'menu',sel:-1,
  vx:0,vy:0,spd:0,fuel:0,score:0,corr:0,tot:0,
  by:0,
  camX:0,camY:0,
  curQ:null,qTL:0,qStart:0,qDur:0,qAns:false,
  nextCP:0,cpPassed:0,
  cans:[],
  usedQ:[],
  stars:[],
  keys:{l:false,r:false},
  flash:0,flashCol:'0,229,160',
  lt:0,

  init(){
    this.cv=document.getElementById('game-canvas');
    this.cx=this.cv.getContext('2d');
    this.resize();
    window.addEventListener('resize',()=>this.resize());
    for(let i=0;i<180;i++)this.stars.push({x:Math.random()*4e3,y:Math.random()*280,s:Math.random()*1.8+.4,tw:Math.random()*Math.PI*2});
    this.buildCans();
    this.buildUI();
    this.loop(0);
  },

  resize(){this.W=innerWidth;this.H=innerHeight;this.cv.width=this.W;this.cv.height=this.H;this.by=this.H*.62},

  buildCans(){this.cans=[];for(let x=C.CAN_DIST;x<C.GOAL+2e3;x+=C.CAN_DIST+Math.random()*280)this.cans.push({x,go:false})},

  buildUI(){
    const g=document.getElementById('vehicle-grid');
    V.forEach((v,i)=>{
      const d=document.createElement('div');
      d.className='vehicle-card';
      d.innerHTML='<div class="vehicle-icon">'+v.icon+'</div><div class="vehicle-name">'+v.name+'</div>'
        +'<div class="stat-row"><span>SPD</span><div class="stat-bg"><div class="stat-fill" style="width:'+v.spd/4+'%;background:'+v.col+'"></div></div></div>'
        +'<div class="stat-row"><span>FUL</span><div class="stat-bg"><div class="stat-fill" style="width:'+v.fCap/1.3+'%;background:'+v.col+'"></div></div></div>'
        +'<div class="stat-row"><span>TRC</span><div class="stat-bg"><div class="stat-fill" style="width:'+v.tr/1.2*100+'%;background:'+v.col+'"></div></div></div>'
        +'<div class="vehicle-desc">'+v.desc+'</div>';
      d.onclick=function(){document.querySelectorAll('.vehicle-card').forEach(function(c){c.classList.remove('selected')});d.classList.add('selected');G.sel=i;document.getElementById('btn-start').disabled=false;document.getElementById('btn-start').textContent='START CLIMB'};
      g.appendChild(d);
    });
    document.getElementById('btn-start').onclick=function(){if(G.sel>=0)G.start(G.sel)};
    document.getElementById('btn-go').onclick=function(){G.reset()};
    document.getElementById('btn-vic').onclick=function(){G.reset()};
    var gb=document.getElementById('btn-gas'),bb=document.getElementById('btn-brake');
    function bind(el,key){
      el.addEventListener('touchstart',function(e){e.preventDefault();G.keys[key]=true;el.classList.add('on')});
      ['touchend','touchcancel'].forEach(function(ev){el.addEventListener(ev,function(e){e.preventDefault();G.keys[key]=false;el.classList.remove('on')})});
    }
    bind(gb,'r');bind(bb,'l');
    document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='d')G.keys.r=true;if(e.key==='ArrowLeft'||e.key==='a')G.keys.l=true});
    document.addEventListener('keyup',function(e){if(e.key==='ArrowRight'||e.key==='d')G.keys.r=false;if(e.key==='ArrowLeft'||e.key==='a')G.keys.l=false});
  },

  start(idx){
    var v=V[idx];
    this.vx=100;this.spd=0;this.fuel=v.fCap;this.score=0;this.corr=0;this.tot=0;
    this.nextCP=C.CP_DIST;this.cpPassed=0;this.usedQ=[];this.flash=0;
    this.camX=this.vx;this.camY=tY(this.vx,this.by);this.keys={l:false,r:false};
    this.cans.forEach(function(c){c.go=false});
    this.state='playing';this.lt=performance.now();
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    if('ontouchstart' in window)document.getElementById('mobile-controls').classList.remove('hidden');
    aInit();engStart();
  },

  loop(ts){
    var dt=Math.min((ts-this.lt)/1e3,.05);this.lt=ts;
    if(this.state==='playing')this.update(dt);
    if(this.state==='quiz'&&!this.qAns)this.updateTimer();
    this.render();
    pUpdate(dt);
    if(this.flash>0)this.flash-=dt;
    requestAnimationFrame(function(t){G.loop(t)});
  },

  update(dt){
    var v=V[this.sel],ang=tA(this.vx,this.by);
    this.spd+=C.GRAVITY*Math.sin(ang)*dt;
    var acc=this.keys.r&&this.fuel>0,brk=this.keys.l;
    if(acc){this.spd+=v.pow*dt;this.fuel-=(C.DRAIN_BASE+C.DRAIN_ACCEL)*v.dRate*dt}
    if(brk)this.spd-=v.pow*.55*dt;
    this.fuel-=C.DRAIN_BASE*.25*v.dRate*dt;
    this.spd*=Math.pow(.97+(v.tr-1)*.008,dt*60);
    this.spd=Math.max(-v.spd*.3,Math.min(v.spd,this.spd));
    this.vx+=this.spd*dt;this.vx=Math.max(0,this.vx);
    this.vy=tY(this.vx,this.by);
    this.score+=Math.abs(this.spd)*C.SCORE_DIST*dt;

    if(acc&&this.fuel>0){pSpawn(this.vx-18*Math.cos(ang),this.vy-18*Math.sin(ang)+4,-this.spd*.25+(Math.random()-.5)*40,(Math.random()-.5)*50-25,.35+Math.random()*.25,3+Math.random()*3,v.col)}
    if(Math.abs(this.spd)>60){pSpawn(this.vx+(Math.random()-.5)*16,this.vy,(Math.random()-.5)*25,-18-Math.random()*25,.4+Math.random()*.25,2+Math.random()*2,'#a08060')}

    this.camX+=(this.vx+130-this.camX)*3.5*dt;
    this.camY+=(this.vy-20-this.camY)*3.5*dt;
    engUpdate(this.spd,acc);

    for(var ci=0;ci<this.cans.length;ci++){var c=this.cans[ci];if(!c.go&&Math.abs(this.vx-c.x)<38){c.go=true;this.fuel=Math.min(V[this.sel].fCap,this.fuel+C.FUEL_CAN);this.score+=C.SCORE_CAN;sndFuel();this.flash=.25;for(var pi=0;pi<7;pi++)pSpawn(c.x,tY(c.x,this.by),(Math.random()-.5)*90,(Math.random()-.5)*90,.45,3,'#00e5a0')}}

    if(this.vx>=this.nextCP)this.showQuiz();
    if(this.vx>=C.GOAL)this.victory();
    if(this.fuel<=0&&Math.abs(this.spd)<3){this.fuel=0;this.gameOver()}
    this.updateHUD();
  },

  render(){
    var ctx=this.cx,W=this.W,H=this.H,cx=this.camX,cy=this.camY;
    var sg=ctx.createLinearGradient(0,0,0,H);
    sg.addColorStop(0,'#080c1e');sg.addColorStop(.35,'#140e30');sg.addColorStop(.65,'#221535');sg.addColorStop(1,'#0d1117');
    ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);

    var st=performance.now()/1e3;
    for(var si=0;si<this.stars.length;si++){var s=this.stars[si];var sx=((s.x-cx*.04)%4e3+4e3)%4e3,tw=.45+.55*Math.sin(st*1.8+s.tw);ctx.globalAlpha=tw*.75;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(sx*(W/4e3),s.y,s.s,0,Math.PI*2);ctx.fill()}
    ctx.globalAlpha=1;

    this.drawMtn(ctx,cx*.08,H*.35,H*.5,'#0e1228',.0008,130);
    this.drawMtn(ctx,cx*.2,H*.4,H*.48,'#161430',.0018,90);
    this.drawMtn(ctx,cx*.38,H*.46,H*.52,'#1c1630',.0035,60);

    ctx.beginPath();var f=true;
    for(var sx=-8;sx<=W+8;sx+=3){var wx=sx+cx-W/2,ty=tY(wx,this.by)-cy+H/2;f?(ctx.moveTo(sx,ty),f=false):ctx.lineTo(sx,ty)}
    ctx.lineTo(W+10,H+10);ctx.lineTo(-10,H+10);ctx.closePath();
    var tg=ctx.createLinearGradient(0,H*.3,0,H);tg.addColorStop(0,'#2a5a1e');tg.addColorStop(.25,'#1e4215');tg.addColorStop(.65,'#183510');tg.addColorStop(1,'#0d1f08');
    ctx.fillStyle=tg;ctx.fill();

    ctx.beginPath();f=true;
    for(sx=-8;sx<=W+8;sx+=3){var wx2=sx+cx-W/2,ty2=tY(wx2,this.by)-cy+H/2;f?(ctx.moveTo(sx,ty2),f=false):ctx.lineTo(sx,ty2)}
    ctx.strokeStyle='#3a7a2a';ctx.lineWidth=3;ctx.stroke();

    for(sx=-8;sx<=W+8;sx+=18){var wx3=sx+cx-W/2,ty3=tY(wx3,this.by)-cy+H/2,ag=tA(wx3,this.by);ctx.save();ctx.translate(sx,ty3);ctx.rotate(ag);ctx.strokeStyle='#4a9a3a';ctx.lineWidth=1.4;for(var j=-3;j<=3;j+=3){ctx.beginPath();ctx.moveTo(j,0);ctx.lineTo(j-2,-5-Math.sin(wx3*.3)*3);ctx.stroke()}ctx.restore()}

    this.drawMarkers(ctx,cx,cy);
    this.drawCans(ctx,cx,cy);
    if(this.sel>=0)this.drawVeh(ctx,cx,cy);
    pDraw(ctx,{x:cx-W/2,y:cy-H/2,hw:W/2,hh:H/2});

    if(this.flash>0){ctx.fillStyle='rgba('+this.flashCol+','+this.flash*1.5+')';ctx.fillRect(0,0,W,H)}
  },

  drawMtn(ctx,ox,baseY,range,col,freq,amp){
    this.cx.fillStyle=col;this.cx.beginPath();this.cx.moveTo(0,this.H);
    for(var sx=0;sx<=this.W;sx+=5){var wx=sx+ox,my=baseY+this.cy*.05-Math.sin(wx*freq)*amp-Math.sin(wx*freq*2.5+1)*amp*.35;this.cx.lineTo(sx,my)}
    this.cx.lineTo(this.W,this.H);this.cx.closePath();this.cx.fill();
  },

  drawMarkers(ctx,cx,cy){
    var W=this.W,H=this.H;
    var cp=C.CP_DIST,n=1;
    while(cp<C.GOAL){var sx=cp-cx+W/2;if(sx>-40&&sx<W+40){var ty=tY(cp,this.by)-cy+H/2;ctx.fillStyle='rgba(255,165,0,.25)';ctx.fillRect(sx-2,ty-72,5,72);var wv=Math.sin(performance.now()/280+cp)*3;ctx.fillStyle='#ffa502';ctx.beginPath();ctx.moveTo(sx+3,ty-72);ctx.lineTo(sx+24+wv,ty-62);ctx.lineTo(sx+3,ty-52);ctx.closePath();ctx.fill();ctx.fillStyle='#ffa502';ctx.font='bold 15px Orbitron';ctx.textAlign='center';ctx.fillText('?',sx,ty-77);ctx.font='9px Exo 2';ctx.fillStyle='rgba(255,165,0,.4)';ctx.fillText('#'+n,sx,ty-92)}cp+=C.CP_DIST;n++}
    var gx=C.GOAL-cx+W/2;if(gx>-40&&gx<W+40){var gy=tY(C.GOAL,this.by)-cy+H/2;ctx.fillStyle='#ff4757';ctx.font='bold 13px Orbitron';ctx.textAlign='center';ctx.fillText('GOAL',gx,gy-65);ctx.fillRect(gx-1,gy-60,3,60);ctx.beginPath();ctx.moveTo(gx+2,gy-60);ctx.lineTo(gx+28,gy-50);ctx.lineTo(gx+2,gy-40);ctx.closePath();ctx.fill()}
    for(var d=5e3;d<C.GOAL;d+=5e3){var sxd=d-cx+W/2;if(sxd>-40&&sxd<W+40){var tyd=tY(d,this.by)-cy+H/2;ctx.fillStyle='rgba(255,255,255,.12)';ctx.font='10px Orbitron';ctx.textAlign='center';ctx.fillText((d/1e3)+'km',sxd,tyd-36)}}
  },

  drawCans(ctx,cx,cy){
    var W=this.W;
    for(var ci=0;ci<this.cans.length;ci++){var c=this.cans[ci];if(c.go)continue;var sx=c.x-cx+W/2;if(sx<-40||sx>W+40)continue;var sy=tY(c.x,this.by)-cy+this.H/2,bob=Math.sin(performance.now()/450+c.x)*5;
    ctx.save();ctx.shadowColor='#00e5a0';ctx.shadowBlur=14;ctx.fillStyle='#00e5a0';ctx.fillRect(sx-7,sy-23+bob,14,16);ctx.fillStyle='#081210';ctx.font='bold 9px Orbitron';ctx.textAlign='center';ctx.fillText('F',sx,sy-11+bob);ctx.fillStyle='#00c882';ctx.fillRect(sx-4,sy-26+bob,8,4);ctx.restore()}
  },

  drawVeh(ctx,cx,cy){
    var W=this.W,sx=this.vx-cx+W/2,sy=this.vy-cy+this.H/2,ang=tA(this.vx,this.by),v=V[this.sel];
    ctx.save();ctx.translate(sx,sy);ctx.rotate(ang);
    var id=v.id;
    if(id==='rocket'){
      ctx.fillStyle=v.col;ctx.beginPath();ctx.moveTo(-20,-5);ctx.lineTo(18,-8);ctx.lineTo(22,0);ctx.lineTo(18,5);ctx.lineTo(-20,5);ctx.closePath();ctx.fill();
      ctx.fillStyle='#70a1ff';ctx.beginPath();ctx.ellipse(5,-8,7,3.5,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#333';ctx.beginPath();ctx.arc(-14,8,7,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(14,8,6,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#555';ctx.beginPath();ctx.arc(-14,8,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(14,8,2.5,0,Math.PI*2);ctx.fill();
    }else if(id==='tank'){
      ctx.fillStyle=v.col;ctx.fillRect(-18,-14,36,14);ctx.fillStyle='#229954';ctx.fillRect(-8,-20,16,8);ctx.fillStyle='#1e8449';ctx.fillRect(8,-18,14,3);
      ctx.fillStyle='#333';ctx.beginPath();ctx.ellipse(-12,8,10,6,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(12,8,10,6,0,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#555';ctx.lineWidth=1;for(var ti=-20;ti<=20;ti+=5){ctx.beginPath();ctx.moveTo(ti,2);ctx.lineTo(ti,14);ctx.stroke()}
    }else if(id==='hover'){
      ctx.fillStyle=v.col;ctx.beginPath();ctx.ellipse(0,-6,20,10,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#a0c4ff';ctx.beginPath();ctx.ellipse(4,-10,8,5,-.2,0,Math.PI*2);ctx.fill();
      ctx.save();ctx.shadowColor='#70a1ff';ctx.shadowBlur=16;ctx.fillStyle='rgba(112,161,255,.35)';ctx.fillRect(-14,2,28,4);ctx.restore();
    }else if(id==='spider'){
      ctx.fillStyle=v.col;ctx.beginPath();ctx.ellipse(0,-8,14,10,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ff0';ctx.beginPath();ctx.arc(-5,-12,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(5,-12,3,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=v.col;ctx.lineWidth=2.5;var la=Math.sin(performance.now()/180)*.12;
      for(var li=0;li<3;li++){var lx=-12+li*12;ctx.beginPath();ctx.moveTo(lx,-2);ctx.lineTo(lx-10,4+Math.sin(la+li)*2);ctx.lineTo(lx-14,12);ctx.stroke();ctx.beginPath();ctx.moveTo(lx,-2);ctx.lineTo(lx+10,4+Math.sin(la+li+1)*2);ctx.lineTo(lx+14,12);ctx.stroke()}
    }else if(id==='steam'){
      ctx.fillStyle=v.col;ctx.fillRect(-18,-14,32,14);ctx.fillStyle='#e67e22';ctx.fillRect(-20,-20,12,20);
      ctx.fillStyle='#333';ctx.fillRect(6,-24,6,10);
      if(this.keys.r&&this.fuel>0){ctx.fillStyle='rgba(200,200,200,.35)';var sm=performance.now()/280;for(var si2=0;si2<3;si2++){ctx.beginPath();ctx.arc(9+si2*3+Math.sin(sm+si2*2)*2,-28-si2*7-Math.sin(sm+si2)*3,3.5+si2*1.8,0,Math.PI*2);ctx.fill()}}
      ctx.fillStyle='#333';ctx.beginPath();ctx.arc(-10,6,7,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(8,6,7,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(18,6,5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#555';ctx.beginPath();ctx.arc(-10,6,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(8,6,3,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  },

  updateHUD(){
    var v=V[this.sel],pct=Math.max(0,this.fuel/v.fCap*100);
    var fb=document.getElementById('fuel-bar');
    fb.style.width=pct+'%';
    if(pct<20)fb.style.background='linear-gradient(90deg,#ff4757,#ff6b81)';
    else if(pct<45)fb.style.background='linear-gradient(90deg,#ff8c42,#ffa502)';
    else fb.style.background='linear-gradient(90deg,#00e5a0,#7bed9f)';
    document.getElementById('fuel-text').textContent=Math.round(this.fuel);
    document.getElementById('score-val').textContent=Math.round(this.score);
    document.getElementById('dist-val').textContent=Math.round(this.vx);
  },

  showQuiz(){
    this.state='quiz';this.tot++;this.nextCP+=C.CP_DIST;this.cpPassed++;
    sndCP();engStop();
    var diff=this.vx<1e4?'easy':this.vx<2e4?'medium':'hard';
    var pool=[];for(var qi=0;qi<Q.length;qi++){if(this.usedQ.indexOf(Q[qi])===-1)pool.push(Q[qi])}
    if(!pool.length){this.usedQ=[];pool=Q.slice()}
    var pref=[];for(var qi2=0;qi2<pool.length;qi2++){if(pool[qi2].d===diff)pref.push(pool[qi2])}
    if(!pref.length)pref=pool;
    var q=pref[Math.random()*pref.length|0];
    this.usedQ.push(q);this.curQ=q;this.qAns=false;
    document.getElementById('quiz-overlay').classList.remove('hidden');
    document.getElementById('q-cat').textContent=q.cat+(q.d==='hard'?' ★★★':q.d==='medium'?' ★★':' ★');
    document.getElementById('q-text').textContent=q.q;
    document.getElementById('quiz-fb').classList.add('hidden');
    var oc=document.getElementById('q-opts');oc.innerHTML='';
    for(var oi=0;oi<q.o.length;oi++){(function(i){var b=document.createElement('button');b.className='q-opt';b.textContent=q.o[i];b.onclick=function(){G.answerQ(i)};oc.appendChild(b)})(oi)}
    var tm=q.d==='easy'?15:q.d==='medium'?18:20;
    this.qTL=tm;this.qStart=performance.now();this.qDur=tm;
    document.getElementById('timer-text').textContent=tm;
    var tc=document.getElementById('t-circle');tc.style.strokeDashoffset='0';tc.classList.remove('warn','danger');
  },

  updateTimer(){
    var el=(performance.now()-this.qStart)/1e3;
    this.qTL=Math.max(0,this.qDur-el);
    document.getElementById('timer-text').textContent=Math.ceil(this.qTL);
    var tc=document.getElementById('t-circle'),pct=this.qTL/this.qDur;
    tc.style.strokeDashoffset=(1-pct)*100.53;
    tc.classList.remove('warn','danger');
    if(pct<.2)tc.classList.add('danger');else if(pct<.4)tc.classList.add('warn');
    if(this.qTL<=0)this.quizTimeout();
  },

  answerQ(idx){
    if(this.qAns)return;this.qAns=true;
    var q=this.curQ,ok=idx===q.a,v=V[this.sel];
    var opts=document.querySelectorAll('.q-opt');
    for(var i=0;i<opts.length;i++){opts[i].classList.add('off');if(i===q.a)opts[i].classList.add('right');if(i===idx&&!ok)opts[i].classList.add('wrong')}
    var fb=document.getElementById('quiz-fb');fb.classList.remove('hidden','ok','nope');
    if(ok){this.corr++;this.fuel=Math.min(v.fCap,this.fuel+C.FUEL_CORRECT);this.score+=C.SCORE_CORR;fb.classList.add('ok');fb.innerHTML='<p id="fb-title">&#10003; Correct! +'+C.FUEL_CORRECT+' fuel</p><p id="fb-explain">'+q.e+'</p>';sndOK();this.flash=.3;this.flashCol='0,229,160'}
    else{this.fuel=Math.max(0,this.fuel+C.FUEL_WRONG);fb.classList.add('nope');fb.innerHTML='<p id="fb-title">&#10007; Incorrect! '+C.FUEL_WRONG+' fuel</p><p id="fb-explain">'+q.e+'</p>';sndBad();this.flash=.3;this.flashCol='255,71,87'}
    setTimeout(function(){document.getElementById('quiz-overlay').classList.add('hidden');G.state='playing';engStart()},2600);
  },

  quizTimeout(){
    if(this.qAns)return;this.qAns=true;
    var q=this.curQ,v=V[this.sel];
    var opts=document.querySelectorAll('.q-opt');for(var i=0;i<opts.length;i++){opts[i].classList.add('off');if(i===q.a)opts[i].classList.add('right')}
    this.fuel=Math.max(0,this.fuel+C.FUEL_WRONG);
    var fb=document.getElementById('quiz-fb');fb.classList.remove('hidden','ok','nope');fb.classList.add('nope');
    fb.innerHTML='<p id="fb-title">&#9200; Time\'s up! '+C.FUEL_WRONG+' fuel</p><p id="fb-explain">'+q.e+'</p>';sndBad();this.flash=.3;this.flashCol='255,71,87';
    setTimeout(function(){document.getElementById('quiz-overlay').classList.add('hidden');G.state='playing';engStart()},2600);
  },

  gameOver(){
    this.state='gameover';engStop();
    document.getElementById('gameover-screen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('mobile-controls').classList.add('hidden');
    document.getElementById('go-dist').textContent=Math.round(this.vx)+' m';
    document.getElementById('go-score').textContent=Math.round(this.score);
    document.getElementById('go-corr').textContent=this.corr+' / '+this.tot;
  },

  victory(){
    this.state='victory';engStop();this.score+=2e3;
    document.getElementById('victory-screen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('mobile-controls').classList.add('hidden');
    document.getElementById('vic-score').textContent=Math.round(this.score);
    document.getElementById('vic-corr').textContent=this.corr+' / '+this.tot;
    document.getElementById('vic-fuel').textContent=Math.round(Math.max(0,this.fuel))+'%';
  },

  reset(){
    document.getElementById('gameover-screen').classList.add('hidden');
    document.getElementById('victory-screen').classList.add('hidden');
    document.getElementById('start-screen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('mobile-controls').classList.add('hidden');
    this.state='menu';this.sel=-1;parts.length=0;this.usedQ=[];
    document.querySelectorAll('.vehicle-card').forEach(function(c){c.classList.remove('selected')});
    var bs=document.getElementById('btn-start');bs.disabled=true;bs.textContent='Select a Vehicle';
  }
};

/* ===================== BOOT ===================== */
window.addEventListener('load',function(){G.init()});

})();
</script>
</body>
</html>
