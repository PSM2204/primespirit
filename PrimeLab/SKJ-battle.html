    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            box-sizing: border-box;
        }

        header h1 {
            font-size: 2rem;
            color: var(--accent);
            margin-bottom: 0.2rem;
            letter-spacing: 1px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-weight: bold;
        }

        .game-area {
            min-height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .grid {
            display: grid;
            gap: 10px;
            margin: 1rem 0;
        }

        .tile {
            width: 70px;
            height: 70px;
            background: #334155;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.3s;
        }

        .tile:active {
            transform: scale(0.95);
        }

        .tile.active {
            background: var(--accent);
            box-shadow: 0 0 15px var(--accent);
        }

        .tile.correct {
            background: var(--success);
        }

        .tile.wrong {
            background: var(--danger);
        }

        .color-text {
            font-size: 3rem;
            font-weight: bold;
            margin: 2rem 0;
            animation: pulse 0.5s ease-in-out;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }

        .btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: var(--accent-hover);
            color: #fff;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        .btn-success {
            background: var(--success);
            color: #fff;
        }

        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.95);
            border-radius: 16px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            z-index: 10;
        }

        .modal.active {
            display: flex;
        }

        canvas#shareCanvas {
            border-radius: 8px;
            margin: 1rem 0;
            max-width: 100%;
            height: auto;
            border: 1px solid var(--text-muted);
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>S.K.J Battle of Minds</h1>
        <p>PrimeLab Brain Training Engine</p>
    </header>

    <div class="hud">
        <div>Stage: <span id="stageNum">1</span> / 50+</div>
        <div>Type: <span id="gameType">Memory</span></div>
        <div>Score: <span id="score">0</span></div>
    </div>

    <div class="game-area" id="gameArea"></div>

    <div class="modal" id="modal">
        <h2 id="modalTitle">Stage Complete!</h2>
        <p id="modalDesc">Generating your Battle Card...</p>
        <canvas id="shareCanvas" width="400" height="220"></canvas>
        <div class="btn-group">
            <button class="btn" id="nextBtn" onclick="nextStage()">Next Stage</button>
            <button class="btn btn-success" onclick="shareScore()">Share Card</button>
        </div>
    </div>
</div>

<script>
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playTone(freq, type = 'sine', duration = 0.15) {
        initAudio();
        if (!audioCtx) return;
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    const sfx = {
        click: () => playTone(400, 'sine', 0.1),
        correct: () => { playTone(523.25, 'triangle', 0.1); setTimeout(() => playTone(659.25, 'triangle', 0.15), 100); },
        wrong: () => playTone(150, 'sawtooth', 0.3),
        win: () => { playTone(440, 'sine', 0.1); setTimeout(() => playTone(554.37, 'sine', 0.1), 100); setTimeout(() => playTone(659.25, 'sine', 0.2), 200); }
    };

    let currentStage = 1;
    let totalScore = 0;

    function getStageType(stage) {
        const types = ['Memory Grid', 'Stroop Focus', 'Speed Recall'];
        return types[(stage - 1) % types.length];
    }

    function initStage() {
        document.getElementById('stageNum').innerText = currentStage;
        document.getElementById('score').innerText = totalScore;
        const type = getStageType(currentStage);
        document.getElementById('gameType').innerText = type;

        const area = document.getElementById('gameArea');
        area.innerHTML = '';

        if (type === 'Memory Grid') setupMemoryGrid(area);
        else if (type === 'Stroop Focus') setupStroopGame(area);
        else if (type === 'Speed Recall') setupSpeedGame(area);
    }

    function setupMemoryGrid(container) {
        const size = currentStage > 15 ? 4 : 3; 
        const grid = document.createElement('div');
        grid.className = 'grid';
        grid.style.gridTemplateColumns = `repeat(${size}, 1fr)`;

        const tileCount = size * size;
        const activeCount = Math.min(3 + Math.floor(currentStage / 3), tileCount - 2);
        
        let sequence = [];
        while(sequence.length < activeCount) {
            let r = Math.floor(Math.random() * tileCount);
            if(!sequence.includes(r)) sequence.push(r);
        }

        const tiles = [];
        for(let i=0; i<tileCount; i++) {
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.dataset.id = i;
            grid.appendChild(tile);
            tiles.push(tile);
        }
        container.appendChild(grid);

        let userSequence = [];
        let canClick = false;

        setTimeout(() => {
            sequence.forEach(idx => tiles[idx].classList.add('active'));
            sfx.click();
            setTimeout(() => {
                sequence.forEach(idx => tiles[idx].classList.remove('active'));
                canClick = true;
            }, Math.max(400, 1000 - (currentStage * 10)));
        }, 500);

        tiles.forEach(tile => {
            tile.addEventListener('click', (e) => {
                if(!canClick) return;
                const id = parseInt(e.target.dataset.id);
                
                if(sequence.includes(id) && !userSequence.includes(id)) {
                    sfx.click();
                    e.target.classList.add('correct');
                    userSequence.push(id);
                    if(userSequence.length === sequence.length) {
                        sfx.correct();
                        completeStage(100 + currentStage * 10);
                    }
                } else if(!sequence.includes(id)) {
                    sfx.wrong();
                    e.target.classList.add('wrong');
                    canClick = false;
                    setTimeout(initStage, 1000);
                }
            });
        });
    }

    function setupStroopGame(container) {
        const colors = [
            { name: 'RED', color: '#ef4444' },
            { name: 'BLUE', color: '#38bdf8' },
            { name: 'GREEN', color: '#22c55e' },
            { name: 'YELLOW', color: '#eab308' }
        ];

        const textItem = colors[Math.floor(Math.random() * colors.length)];
        let colorItem = colors[Math.floor(Math.random() * colors.length)];

        const textEl = document.createElement('div');
        textEl.className = 'color-text';
        textEl.innerText = textItem.name;
        textEl.style.color = colorItem.color;
        container.appendChild(textEl);

        const prompt = document.createElement('p');
        prompt.innerText = "Does the TEXT match the COLOR?";
        prompt.style.marginBottom = "1.5rem";
        container.appendChild(prompt);

        const btnGroup = document.createElement('div');
        btnGroup.className = 'btn-group';

        const isMatch = textItem.name === colorItem.name;

        const yesBtn = document.createElement('button');
        yesBtn.className = 'btn btn-success';
        yesBtn.innerText = 'YES';
        yesBtn.onclick = () => handleStroop(isMatch === true);

        const noBtn = document.createElement('button');
        noBtn.className = 'btn btn-danger';
        noBtn.innerText = 'NO';
        noBtn.onclick = () => handleStroop(isMatch === false);

        btnGroup.appendChild(yesBtn);
        btnGroup.appendChild(noBtn);
        container.appendChild(btnGroup);

        function handleStroop(correct) {
            if(correct) {
                sfx.correct();
                completeStage(80 + currentStage * 10);
            } else {
                sfx.wrong();
                setTimeout(initStage, 800);
            }
        }
    }

    function setupSpeedGame(container) {
        const num1 = Math.floor(Math.random() * (5 + currentStage)) + 1;
        const num2 = Math.floor(Math.random() * (5 + currentStage)) + 1;
        const ans = num1 + num2;

        const mathEl = document.createElement('div');
        mathEl.className = 'color-text';
        mathEl.innerText = `${num1} + ${num2} = ?`;
        container.appendChild(mathEl);

        const btnGroup = document.createElement('div');
        btnGroup.className = 'btn-group';

        let choices = Array.from(new Set([ans, ans + 1, Math.max(1, ans - 1)])).sort(() => Math.random() - 0.5);

        choices.forEach(choice => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = choice;
            btn.onclick = () => {
                if(choice === ans) {
                    sfx.correct();
                    completeStage(90 + currentStage * 10);
                } else {
                    sfx.wrong();
                    setTimeout(initStage, 800);
                }
            };
            btnGroup.appendChild(btn);
        });

        container.appendChild(btnGroup);
    }

    function completeStage(points) {
        totalScore += points;
        sfx.win();
        generateFaceCard();
        document.getElementById('modal').classList.add('active');
    }

    function nextStage() {
        currentStage++;
        document.getElementById('modal').classList.remove('active');
        initStage();
    }

    function generateFaceCard() {
        const canvas = document.getElementById('shareCanvas');
        const ctx = canvas.getContext('2d');

        const grad = ctx.createLinearGradient(0, 0, 400, 220);
        grad.addColorStop(0, '#1e293b');
        grad.addColorStop(1, '#0f172a');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 400, 220);

        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 4;
        ctx.strokeRect(10, 10, 380, 200);

        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 20px sans-serif';
        ctx.fillText('S.K.J BATTLE OF MINDS', 30, 45);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '12px sans-serif';
        ctx.fillText('PrimeLab Cognitive Assessment', 30, 65);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 36px sans-serif';
        ctx.fillText(`STAGE ${currentStage}`, 30, 125);

        ctx.fillStyle = '#22c55e';
        ctx.font = 'bold 22px sans-serif';
        ctx.fillText(`Score: ${totalScore} pts`, 30, 160);

        ctx.fillStyle = '#38bdf8';
        ctx.font = 'italic bold 14px sans-serif';
        ctx.fillText('POWERED BY PRIMELAB', 210, 190);
    }

    function shareScore() {
        const canvas = document.getElementById('shareCanvas');
        canvas.toBlob(blob => {
            const file = new File([blob], 'skj_battle_score.png', { type: 'image/png' });
            if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                navigator.share({
                    title: 'S.K.J Battle of Minds',
                    text: `I reached Stage ${currentStage} with ${totalScore} points in S.K.J Battle of Minds!`,
                    files: [file]
                }).catch(console.error);
            } else {
                alert(`Share card ready!\n\nScore: ${totalScore} Points | Stage: ${currentStage}`);
            }
        });
    }

    window.onload = initStage;
</script>
</body>
</html>
