<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PrimeBoard</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #f6f7fb;
      color: #111827;
      overflow: hidden;
    }
    button, input, select, textarea { font: inherit; }
    hr { border: none; border-top: 1px solid #e5e7eb; margin: 10px 0; }

    .topbar {
      position: fixed;
      inset: 0 0 auto 0;
      height: 58px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid #e5e7eb;
      z-index: 50;
      backdrop-filter: blur(8px);
      overflow-x: auto;
      white-space: nowrap;
    }
    .topbar > * { flex: 0 0 auto; }

    .brand { font-weight: 800; letter-spacing: .2px; font-size: 20px; }
    .powered { color: #6b7280; font-size: 12px; }
    .spacer { flex: 1; }

    .topbar input,
    .topbar select {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 8px 10px;
      background: #fff;
    }

    .btn {
      border: 1px solid #e5e7eb;
      background: #fff;
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn.primary { background: #4f46e5; border-color: #4f46e5; color: #fff; }
    .btn:disabled,
    .tool-btn:disabled { opacity: .45; cursor: not-allowed; }

    .toolbar {
      position: fixed;
      top: 70px;
      left: 12px;
      z-index: 40;
      width: 68px;
    }

    .panel {
      background: rgba(255,255,255,.97);
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      box-shadow: 0 14px 40px rgba(17,24,39,.10);
      padding: 12px;
    }

    .panel-title {
      font-size: 12px;
      font-weight: 700;
      color: #374151;
      margin: 0 0 8px;
      text-transform: uppercase;
      letter-spacing: .3px;
    }

    .tool-stack { display: flex; flex-direction: column; gap: 6px; }

    .tool-btn {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 1px solid transparent;
      background: transparent;
      font-size: 20px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .tool-btn.active { background: #eef2ff; border-color: #6366f1; }

    .zoom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      flex-wrap: wrap;
    }
    #zoomLabel {
      font-size: 12px;
      color: #374151;
      min-width: 42px;
      text-align: center;
    }

    .settings {
      position: fixed;
      top: 70px;
      right: 12px;
      width: 290px;
      max-height: calc(100vh - 90px);
      overflow: auto;
      z-index: 40;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      margin: 7px 0;
    }
    .row label { font-size: 12px; color: #4b5563; }
    .row input[type="range"] { width: 125px; }
    .row input[type="number"] {
      width: 70px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 4px;
      background: #fff;
    }
    .row select,
    .row input[type="color"] {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #fff;
      padding: 4px;
    }

    .hint { font-size: 11px; color: #6b7280; line-height: 1.35; }

    .reactions { display: flex; flex-wrap: wrap; gap: 6px; }
    .reactions button {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      background: #fff;
      font-size: 22px;
      cursor: pointer;
    }

    .text-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
    .text-buttons button {
      border: 1px solid #e5e7eb;
      background: #fff;
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
    }

    .invite-box {
      width: 100%;
      min-height: 64px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 8px;
      resize: vertical;
      background: #fff;
    }

    .board {
      position: fixed;
      top: 58px;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      background: #fff;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #bgCanvas { z-index: 1; }
    #mainCanvas { z-index: 2; }
    #overlayCanvas { pointer-events: auto; touch-action: none; z-index: 3; }

    .text-editor {
      position: absolute;
      z-index: 25;
      border: 1.5px dashed #6366f1;
      border-radius: 8px;
      outline: none;
      background: rgba(255,255,255,.35);
      resize: none;
      overflow: hidden;
      line-height: 1.2;
      padding: 2px 4px;
    }

    .reaction-float {
      position: fixed;
      bottom: 24px;
      z-index: 80;
      font-size: 36px;
      pointer-events: none;
      animation: floatUp 2s ease-out forwards;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(.7); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translateY(-220px) scale(1.3); opacity: 0; }
    }

    @media (max-width: 900px) {
      .settings { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">PrimeBoard</div>
    <div class="powered">Powered by Prime Spirit Mentors</div>
    <div class="spacer"></div>

    <label class="powered" for="roleSelect">I am the...</label>
    <select id="roleSelect" aria-label="Role">
      <option>Teacher</option>
      <option>Student</option>
    </select>

    <input id="userName" placeholder="Your name" />
    <input id="classCode" placeholder="Class room code" />
    <button id="enterBoardBtn" class="btn primary">Enter Board</button>

    <button class="btn" data-action="invite">Invite</button>
    <button class="btn" data-action="library">Library</button>
    <button class="btn" data-action="share">Share</button>
    <button class="btn" data-action="toolkit">Toolkit</button>
    <button class="btn" data-action="graph">Graph</button>
    <button class="btn" data-action="math">Math</button>
    <button class="btn" data-action="spotlight">Spotlight</button>
    <button class="btn" data-action="record">Record</button>
  </header>

  <div class="toolbar">
    <div class="panel">
      <div class="panel-title">Tools</div>
      <div class="tool-stack">
        <button class="tool-btn" data-tool="select" title="Select / Move (V)">🖱️</button>
        <button class="tool-btn" data-tool="hand" title="Pan (H / Space / Middle drag)">✋</button>
        <button class="tool-btn active" data-tool="pen" title="Pen (P)">✏️</button>
        <button class="tool-btn" data-tool="eraser" title="Eraser (E)">🧽</button>
        <button class="tool-btn" data-tool="shape" title="Shapes (S)">▢</button>
        <button class="tool-btn" data-tool="text" title="Text (T)">🅣</button>
      </div>

      <hr />

      <div class="tool-stack">
        <button class="tool-btn" data-action="undo" title="Undo (Ctrl+Z)">↩️</button>
        <button class="tool-btn" data-action="redo" title="Redo (Ctrl+Y)">↪️</button>
        <button class="tool-btn" data-action="clear" title="Clear board">🗑️</button>
      </div>

      <hr />

      <div class="zoom-row">
        <button class="tool-btn" data-action="zoomOut" title="Zoom out">−</button>
        <span id="zoomLabel">100%</span>
        <button class="tool-btn" data-action="zoomIn" title="Zoom in">+</button>
        <button class="tool-btn" data-action="zoomReset" title="Reset view">⌂</button>
      </div>
    </div>
  </div>

  <aside class="settings panel">
    <div class="panel-title">Pen</div>

    <div class="row">
      <label for="penMode">Mode</label>
      <select id="penMode">
        <option value="writing">Everyday Writing</option>
        <option value="artistic">Artistic</option>
        <option value="highlighter">Highlighter</option>
      </select>
    </div>

    <div class="row">
      <label for="penColor">Color</label>
      <input id="penColor" type="color" value="#111827" />
    </div>

    <div class="row">
      <label for="penSize">Thickness <span id="penSizeValue">3px</span></label>
      <input id="penSize" type="range" min="1" max="24" value="3" />
    </div>

    <hr />

    <div class="panel-title">Precision Eraser</div>

    <div class="row">
      <label for="eraserSize">Eraser size <span id="eraserSizeValue">22px</span></label>
      <input id="eraserSize" type="range" min="6" max="90" value="22" />
    </div>

    <div class="row">
      <label for="precisionEraser">Precision vector erase</label>
      <input id="precisionEraser" type="checkbox" checked />
    </div>

    <div class="hint">
      Precision eraser removes only the touched stroke segments and splits strokes.
      Disable it to erase whole touched objects.
    </div>

    <hr />

    <div class="panel-title">Shapes</div>

    <div class="row">
      <label for="shapeType">Shape</label>
      <select id="shapeType">
        <option value="rect">Rectangle</option>
        <option value="ellipse">Ellipse</option>
        <option value="diamond">Diamond</option>
        <option value="line">Line</option>
        <option value="arrow">Arrow</option>
      </select>
    </div>

    <div class="row">
      <label for="shapeStrokeColor">Stroke</label>
      <input id="shapeStrokeColor" type="color" value="#111827" />
    </div>

    <div class="row">
      <label for="shapeFillColor">Background</label>
      <input id="shapeFillColor" type="color" value="#fde68a" />
    </div>

    <div class="row">
      <label for="shapeStrokeWidth">Stroke width</label>
      <input id="shapeStrokeWidth" type="range" min="1" max="16" value="2" />
    </div>

    <div class="row">
      <label for="fillStyle">Fill style</label>
      <select id="fillStyle">
        <option value="solid">Solid</option>
        <option value="hachure">Hachure</option>
        <option value="cross">Cross</option>
        <option value="none">None</option>
      </select>
    </div>

    <div class="row">
      <label for="edgeStyle">Edges</label>
      <select id="edgeStyle">
        <option value="round">Round</option>
        <option value="sharp">Sharp</option>
      </select>
    </div>

    <hr />

    <div class="panel-title">Background</div>

    <div class="row">
      <label for="backgroundColor">Board color</label>
      <input id="backgroundColor" type="color" value="#ffffff" />
    </div>

    <div class="row">
      <label for="gridStyle">Grid</label>
      <select id="gridStyle">
        <option value="dot">Dot</option>
        <option value="grid">Grid</option>
        <option value="hybrid">Hybrid</option>
        <option value="diamond">Diamond</option>
        <option value="solid">Solid</option>
      </select>
    </div>

    <hr />

    <div class="panel-title">Timer</div>

    <div class="row">
      <label for="timerMinutes">Minutes</label>
      <input id="timerMinutes" type="number" min="0" max="180" value="1" />
    </div>

    <div class="row">
      <label for="timerSeconds">Seconds</label>
      <input id="timerSeconds" type="number" min="0" max="59" value="0" />
    </div>

    <div class="row">
      <label>Remaining</label>
      <strong id="timerDisplay">01:00</strong>
    </div>

    <div class="text-buttons">
      <button data-timer="start">Start</button>
      <button data-timer="pause">Pause</button>
      <button data-timer="reset">Reset</button>
    </div>

    <hr />

    <div class="panel-title">Invite Students</div>

    <div class="row">
      <label for="inviteEmails">Email addresses</label>
    </div>

    <textarea
      id="inviteEmails"
      class="invite-box"
      placeholder="student1@school.edu, student2@school.edu"
    ></textarea>

    <div class="text-buttons" style="margin-top:8px;">
      <button data-action="addStudent">Add Student</button>
      <button data-action="sendInvites">Send Invites</button>
    </div>

    <hr />

    <div class="panel-title">Reactions</div>
    <div class="reactions">
      <button data-reaction="🔥">🔥</button>
      <button data-reaction="❤️">❤️</button>
      <button data-reaction="😂">😂</button>
      <button data-reaction="👏">👏</button>
      <button data-reaction="💯">💯</button>
      <button data-reaction="🤯">🤯</button>
      <button data-reaction="🙌">🙌</button>
      <button data-reaction="😍">😍</button>
    </div>
  </aside>

  <main id="boardContainer" class="board" aria-label="PrimeBoard whiteboard">
    <canvas id="bgCanvas"></canvas>
    <canvas id="mainCanvas"></canvas>
    <canvas id="overlayCanvas"></canvas>
  </main>

  <script>
    (() => {
      'use strict';

      const $ = (sel, root = document) => root.querySelector(sel);
      const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

      const container = $('#boardContainer');
      const bgCanvas = $('#bgCanvas');
      const mainCanvas = $('#mainCanvas');
      const overlayCanvas = $('#overlayCanvas');

      const bgCtx = bgCanvas.getContext('2d');
      const mainCtx = mainCanvas.getContext('2d');
      const overlayCtx = overlayCanvas.getContext('2d');

      const state = {
        tool: 'pen',
        objects: [],
        selected: new Set(),
        view: { x: 0, y: 0, scale: 1 },
        background: '#ffffff',
        gridStyle: 'dot',
        gridColor: '#e5e7eb',
        gridSize: 28
      };

      const pen = {
        color: '#111827',
        size: 3,
        mode: 'writing'
      };

      const eraser = {
        size: 22,
        precision: true
      };

      const shapeStyle = {
        shape: 'rect',
        strokeColor: '#111827',
        fillColor: '#fde68a',
        strokeWidth: 2,
        fillStyle: 'solid',
        edges: 'round'
      };

      let dpr = 1;
      let currentStroke = null;
      let currentShape = null;
      let isPanning = false;
      let isErasing = false;
      let activeGesture = null;
      let moveState = null;
      let panStart = null;
      let pinch = null;
      let spaceDown = false;
      let lastPointerClient = { x: 0, y: 0 };
      let pointerOverCanvas = false;

      const pointers = new Map();

      let undoStack = [];
      let redoStack = [];

      let timerInterval = null;
      let timerRemaining = 60;

      const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
      const makeId = () => Math.random().toString(36).slice(2, 9);
      const deepClone = (value) =>
        typeof structuredClone === 'function'
          ? structuredClone(value)
          : JSON.parse(JSON.stringify(value));
      const positiveMod = (v, m) => ((v % m) + m) % m;

      function updateUndoButtons() {
        $$('[data-action="undo"]').forEach((b) => (b.disabled = !undoStack.length));
        $$('[data-action="redo"]').forEach((b) => (b.disabled = !redoStack.length));
      }

      function pushUndo() {
        undoStack.push(deepClone(state.objects));
        if (undoStack.length > 80) undoStack.shift();
        redoStack.length = 0;
        updateUndoButtons();
      }

      function popLastUndoIfUnused() {
        if (undoStack.length) undoStack.pop();
        updateUndoButtons();
      }

      function undo() {
        if (!undoStack.length) return;
        redoStack.push(deepClone(state.objects));
        state.objects = undoStack.pop();
        state.selected.clear();
        renderAll();
        updateUndoButtons();
      }

      function redo() {
        if (!redoStack.length) return;
        undoStack.push(deepClone(state.objects));
        state.objects = redoStack.pop();
        state.selected.clear();
        renderAll();
        updateUndoButtons();
      }

      function containerRect() {
        return container.getBoundingClientRect();
      }

      function toLocal(clientX, clientY) {
        const r = containerRect();
        return { x: clientX - r.left, y: clientY - r.top };
      }

      function screenToWorld(clientX, clientY) {
        const p = toLocal(clientX, clientY);
        return {
          x: (p.x - state.view.x) / state.view.scale,
          y: (p.y - state.view.y) / state.view.scale
        };
      }

      function worldToScreenPoint(world) {
        return {
          x: world.x * state.view.scale + state.view.x,
          y: world.y * state.view.scale + state.view.y
        };
      }

      function resizeCanvases() {
        const r = containerRect();
        dpr = window.devicePixelRatio || 1;

        [bgCanvas, mainCanvas, overlayCanvas].forEach((c) => {
          c.width = Math.max(1, Math.round(r.width * dpr));
          c.height = Math.max(1, Math.round(r.height * dpr));
        });

        renderAll();
      }

      function renderAll() {
        renderBackground();
        renderMain();
        renderOverlay();
        $('#zoomLabel').textContent = `${Math.round(state.view.scale * 100)}%`;
      }

      let overlayQueued = false;
      function requestRenderOverlay() {
        if (overlayQueued) return;
        overlayQueued = true;
        requestAnimationFrame(() => {
          overlayQueued = false;
          renderOverlay();
        });
      }

      function renderBackground() {
        const w = bgCanvas.width;
        const h = bgCanvas.height;

        bgCtx.setTransform(1, 0, 0, 1, 0, 0);
        bgCtx.clearRect(0, 0, w, h);
        bgCtx.fillStyle = state.background;
        bgCtx.fillRect(0, 0, w, h);

        if (state.gridStyle === 'solid') return;

        const grid = state.gridSize * state.view.scale * dpr;
        if (grid < 7) return;

        const ox = positiveMod(state.view.x * dpr, grid);
        const oy = positiveMod(state.view.y * dpr, grid);

        bgCtx.save();
        bgCtx.strokeStyle = state.gridColor;
        bgCtx.fillStyle = state.gridColor;
        bgCtx.lineWidth = 1;

        if (state.gridStyle === 'grid' || state.gridStyle === 'hybrid') {
          bgCtx.globalAlpha = state.gridStyle === 'hybrid' ? 0.18 : 0.35;
          bgCtx.beginPath();

          for (let x = ox; x <= w; x += grid) {
            bgCtx.moveTo(x, 0);
            bgCtx.lineTo(x, h);
          }

          for (let y = oy; y <= h; y += grid) {
            bgCtx.moveTo(0, y);
            bgCtx.lineTo(w, y);
          }

          bgCtx.stroke();
        }

        if (state.gridStyle === 'dot' || state.gridStyle === 'hybrid') {
          bgCtx.globalAlpha = 0.65;
          const radius = Math.max(1, dpr * (state.gridStyle === 'hybrid' ? 0.8 : 1.05));

          for (let x = ox; x <= w; x += grid) {
            for (let y = oy; y <= h; y += grid) {
              bgCtx.beginPath();
              bgCtx.arc(x, y, radius, 0, Math.PI * 2);
              bgCtx.fill();
            }
          }
        }

        if (state.gridStyle === 'diamond') {
          bgCtx.globalAlpha = 0.22;
          bgCtx.beginPath();

          for (let x = -h; x < w + h; x += grid) {
            bgCtx.moveTo(x + ox, 0);
            bgCtx.lineTo(x + ox - h, h);

            bgCtx.moveTo(x + ox, 0);
            bgCtx.lineTo(x + ox + h, h);
          }

          bgCtx.stroke();
        }

        bgCtx.restore();
      }

      function renderMain() {
        mainCtx.setTransform(1, 0, 0, 1, 0, 0);
        mainCtx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
        mainCtx.setTransform(
          dpr * state.view.scale,
          0,
          0,
          dpr * state.view.scale,
          dpr * state.view.x,
          dpr * state.view.y
        );

        for (const obj of state.objects) {
          drawObject(mainCtx, obj);
        }
      }

      function renderOverlay() {
        overlayCtx.setTransform(1, 0, 0, 1, 0, 0);
        overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

        if (currentStroke || currentShape) {
          overlayCtx.setTransform(
            dpr * state.view.scale,
            0,
            0,
            dpr * state.view.scale,
            dpr * state.view.x,
            dpr * state.view.y
          );

          if (currentStroke) drawObject(overlayCtx, currentStroke);
          if (currentShape) drawObject(overlayCtx, currentShape);
        }

        overlayCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

        overlayCtx.save();
        overlayCtx.strokeStyle = '#4f46e5';
        overlayCtx.lineWidth = 1.5;
        overlayCtx.setLineDash([6, 4]);

        for (const id of state.selected) {
          const obj = state.objects.find((o) => o.id === id);
          if (!obj) continue;

          const bbox = getObjectBBox(obj);
          const p = worldToScreenPoint({ x: bbox.x, y: bbox.y });

          overlayCtx.strokeRect(
            p.x - 4,
            p.y - 4,
            bbox.w * state.view.scale + 8,
            bbox.h * state.view.scale + 8
          );
        }

        overlayCtx.restore();

        if (state.tool === 'eraser' && pointerOverCanvas) {
          const local = toLocal(lastPointerClient.x, lastPointerClient.y);
          const cssW = overlayCanvas.width / dpr;
          const cssH = overlayCanvas.height / dpr;

          if (local.x >= 0 && local.y >= 0 && local.x <= cssW && local.y <= cssH) {
            overlayCtx.save();
            overlayCtx.strokeStyle = '#111827';
            overlayCtx.fillStyle = 'rgba(17,24,39,0.08)';
            overlayCtx.setLineDash(eraser.precision ? [2, 3] : []);

            overlayCtx.beginPath();
            overlayCtx.arc(local.x, local.y, eraser.size / 2, 0, Math.PI * 2);
            overlayCtx.fill();
            overlayCtx.stroke();

            if (eraser.precision) {
              overlayCtx.beginPath();
              overlayCtx.arc(local.x, local.y, 1.2, 0, Math.PI * 2);
              overlayCtx.fillStyle = '#111827';
              overlayCtx.fill();
            }

            overlayCtx.restore();
          }
        }
      }

      function drawObject(ctx, obj) {
        if (!obj) return;

        if (obj.type === 'stroke') drawStroke(ctx, obj);
        else if (obj.type === 'shape') drawShape(ctx, obj);
        else if (obj.type === 'text') drawText(ctx, obj);
      }

      function midPoint(a, b) {
        return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      }

      function strokeSegment(ctx, a, b, w) {
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.lineWidth = w;
        ctx.stroke();
      }

      function drawStroke(ctx, stroke) {
        const pts = stroke.points;
        if (!pts || !pts.length) return;

        ctx.save();
        ctx.globalAlpha = stroke.opacity ?? 1;
        ctx.strokeStyle = stroke.color;
        ctx.fillStyle = stroke.color;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        if (pts.length === 1) {
          const p = pts[0];
          ctx.beginPath();
          ctx.arc(p.x, p.y, (p.w ?? stroke.size) / 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          return;
        }

        if (stroke.mode === 'highlighter') {
          ctx.lineWidth = stroke.size;
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);

          for (let i = 1; i < pts.length - 1; i++) {
            const mid = midPoint(pts[i], pts[i + 1]);
            ctx.quadraticCurveTo(pts[i].x, pts[i].y, mid.x, mid.y);
          }

          ctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
          ctx.stroke();
          ctx.restore();
          return;
        }

        if (pts.length === 2) {
          ctx.lineWidth = ((pts[0].w ?? stroke.size) + (pts[1].w ?? stroke.size)) / 2;
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          ctx.lineTo(pts[1].x, pts[1].y);
          ctx.stroke();
          ctx.restore();
          return;
        }

        strokeSegment(ctx, pts[0], midPoint(pts[0], pts[1]), pts[0].w ?? stroke.size);

        for (let i = 1; i < pts.length - 1; i++) {
          const m1 = midPoint(pts[i - 1], pts[i]);
          const m2 = midPoint(pts[i], pts[i + 1]);

          ctx.beginPath();
          ctx.moveTo(m1.x, m1.y);
          ctx.quadraticCurveTo(pts[i].x, pts[i].y, m2.x, m2.y);
          ctx.lineWidth = pts[i].w ?? stroke.size;
          ctx.stroke();
        }

        const last = pts[pts.length - 1];
        strokeSegment(ctx, midPoint(pts[pts.length - 2], last), last, last.w ?? stroke.size);

        ctx.restore();
      }

      function normalizeShape(obj) {
        return {
          x: Math.min(obj.x1, obj.x2),
          y: Math.min(obj.y1, obj.y2),
          w: Math.abs(obj.x2 - obj.x1),
          h: Math.abs(obj.y2 - obj.y1)
        };
      }

      function getShapeBBox(obj) {
        return normalizeShape(obj);
      }

      function buildShapePath(obj) {
        const path = new Path2D();

        if (obj.shape === 'line' || obj.shape === 'arrow') {
          path.moveTo(obj.x1, obj.y1);
          path.lineTo(obj.x2, obj.y2);
          return path;
        }

        const { x, y, w, h } = normalizeShape(obj);

        if (obj.shape === 'rect') {
          path.rect(x, y, w, h);
        } else if (obj.shape === 'ellipse') {
          path.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
        } else if (obj.shape === 'diamond') {
          path.moveTo(x + w / 2, y);
          path.lineTo(x + w, y + h / 2);
          path.lineTo(x + w / 2, y + h);
          path.lineTo(x, y + h / 2);
          path.closePath();
        }

        return path;
      }

      function drawArrowHead(ctx, obj) {
        const angle = Math.atan2(obj.y2 - obj.y1, obj.x2 - obj.x1);
        const size = Math.max(10, obj.strokeWidth * 4);

        ctx.beginPath();
        ctx.moveTo(obj.x2, obj.y2);
        ctx.lineTo(
          obj.x2 - size * Math.cos(angle - Math.PI / 7),
          obj.y2 - size * Math.sin(angle - Math.PI / 7)
        );

        ctx.moveTo(obj.x2, obj.y2);
        ctx.lineTo(
          obj.x2 - size * Math.cos(angle + Math.PI / 7),
          obj.y2 - size * Math.sin(angle + Math.PI / 7)
        );

        ctx.stroke();
      }

      function fillShapeStyle(ctx, obj, path) {
        const bbox = getShapeBBox(obj);

        if (obj.fillStyle === 'solid') {
          ctx.fillStyle = obj.fillColor;
          ctx.fill(path);
          return;
        }

        ctx.save();
        ctx.clip(path);
        ctx.strokeStyle = obj.fillColor;
        ctx.globalAlpha = 0.9;
        ctx.lineWidth = Math.max(1, obj.strokeWidth * 0.45);

        const spacing = Math.max(6, obj.strokeWidth * 3.2);
        ctx.beginPath();

        if (obj.fillStyle === 'hachure' || obj.fillStyle === 'cross') {
          for (let x = bbox.x - bbox.h; x < bbox.x + bbox.w + bbox.h; x += spacing) {
            ctx.moveTo(x, bbox.y);
            ctx.lineTo(x + bbox.h, bbox.y + bbox.h);
          }
        }

        if (obj.fillStyle === 'cross') {
          for (let x = bbox.x - bbox.h; x < bbox.x + bbox.w + bbox.h; x += spacing) {
            ctx.moveTo(x + bbox.h, bbox.y);
            ctx.lineTo(x, bbox.y + bbox.h);
          }
        }

        ctx.stroke();
        ctx.restore();
      }

      function drawShape(ctx, obj) {
        ctx.save();
        ctx.strokeStyle = obj.strokeColor;
        ctx.fillStyle = obj.fillColor;
        ctx.lineWidth = obj.strokeWidth;
        ctx.lineCap = 'round';
        ctx.lineJoin = obj.edges === 'round' ? 'round' : 'miter';

        if (obj.shape === 'line' || obj.shape === 'arrow') {
          ctx.beginPath();
          ctx.moveTo(obj.x1, obj.y1);
          ctx.lineTo(obj.x2, obj.y2);
          ctx.stroke();

          if (obj.shape === 'arrow') drawArrowHead(ctx, obj);

          ctx.restore();
          return;
        }

        const path = buildShapePath(obj);

        if (obj.fillStyle && obj.fillStyle !== 'none') {
          fillShapeStyle(ctx, obj, path);
        }

        ctx.stroke(path);
        ctx.restore();
      }

      function drawText(ctx, obj) {
        ctx.save();
        ctx.fillStyle = obj.color;
        ctx.font = `${obj.fontWeight || 400} ${obj.fontSize}px Inter, Arial, sans-serif`;
        ctx.textBaseline = 'top';

        const lines = String(obj.text || '').split(/\n/);
        lines.forEach((line, i) => {
          ctx.fillText(line, obj.x, obj.y + i * obj.fontSize * 1.25);
        });

        ctx.restore();
      }

      function getObjectBBox(obj) {
        if (obj.type === 'stroke') {
          let minX = Infinity;
          let minY = Infinity;
          let maxX = -Infinity;
          let maxY = -Infinity;

          for (const p of obj.points || []) {
            minX = Math.min(minX, p.x);
            minY = Math.min(minY, p.y);
            maxX = Math.max(maxX, p.x);
            maxY = Math.max(maxY, p.y);
          }

          if (!isFinite(minX)) return { x: 0, y: 0, w: 0, h: 0 };

          const pad = (obj.size || 3) / 2 + 2;

          return {
            x: minX - pad,
            y: minY - pad,
            w: maxX - minX + pad * 2,
            h: maxY - minY + pad * 2
          };
        }

        if (obj.type === 'shape') {
          const b = getShapeBBox(obj);
          const pad = (obj.strokeWidth || 2) / 2 + 2;

          return {
            x: b.x - pad,
            y: b.y - pad,
            w: b.w + pad * 2,
            h: b.h + pad * 2
          };
        }

        if (obj.type === 'text') {
          const lines = String(obj.text || '').split(/\n/);
          const width = lines.reduce(
            (max, line) => Math.max(max, line.length * obj.fontSize * 0.62),
            10
          );
          const height = Math.max(1, lines.length) * obj.fontSize * 1.25;

          return { x: obj.x, y: obj.y, w: width, h: height };
        }

        return { x: 0, y: 0, w: 0, h: 0 };
      }

      function segmentIntersectsCircle(a, b, c, r) {
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const l2 = dx * dx + dy * dy;

        if (l2 === 0) {
          return Math.hypot(a.x - c.x, a.y - c.y) <= r;
        }

        let t = ((c.x - a.x) * dx + (c.y - a.y) * dy) / l2;
        t = clamp(t, 0, 1);

        const px = a.x + t * dx;
        const py = a.y + t * dy;

        return Math.hypot(px - c.x, py - c.y) <= r;
      }

      function hitStroke(stroke, x, y, tol) {
        const pts = stroke.points;
        if (!pts || !pts.length) return false;

        if (pts.length === 1) {
          return Math.hypot(pts[0].x - x, pts[0].y - y) <= tol + ((pts[0].w ?? stroke.size) / 2);
        }

        for (let i = 0; i < pts.length; i++) {
          if (Math.hypot(pts[i].x - x, pts[i].y - y) <= tol + ((pts[i].w ?? stroke.size) / 2)) {
            return true;
          }
        }

        for (let i = 0; i < pts.length - 1; i++) {
          const r = tol + ((pts[i].w ?? stroke.size) + (pts[i + 1].w ?? stroke.size)) / 4;
          if (segmentIntersectsCircle(pts[i], pts[i + 1], { x, y }, r)) return true;
        }

        return false;
      }

      function hitShape(obj, x, y, tol) {
        if (obj.shape === 'line' || obj.shape === 'arrow') {
          return segmentIntersectsCircle(
            { x: obj.x1, y: obj.y1 },
            { x: obj.x2, y: obj.y2 },
            { x, y },
            tol + obj.strokeWidth / 2
          );
        }

        const b = getShapeBBox(obj);
        return (
          x >= b.x - tol &&
          x <= b.x + b.w + tol &&
          y >= b.y - tol &&
          y <= b.y + b.h + tol
        );
      }

      function hitTestObject(obj, x, y, tol = 6 / state.view.scale) {
        if (!obj) return false;

        if (obj.type === 'stroke') return hitStroke(obj, x, y, tol);
        if (obj.type === 'shape') return hitShape(obj, x, y, tol);

        if (obj.type === 'text') {
          const b = getObjectBBox(obj);
          return (
            x >= b.x - tol &&
            x <= b.x + b.w + tol &&
            y >= b.y - tol &&
            y <= b.y + b.h + tol
          );
        }

        return false;
      }

      function topHit(x, y) {
        for (let i = state.objects.length - 1; i >= 0; i--) {
          if (hitTestObject(state.objects[i], x, y)) return state.objects[i];
        }
        return null;
      }

      function makeStrokePoint(e, world, last) {
        let width = pen.mode === 'highlighter' ? pen.size * 2.3 : pen.size;

        if (pen.mode !== 'highlighter') {
          if (e.pointerType === 'pen' && e.pressure > 0) {
            width = pen.size * (0.45 + e.pressure * (pen.mode === 'artistic' ? 1.75 : 1.2));
          } else if (last) {
            const d = Math.hypot(world.x - last.x, world.y - last.y);
            const dt = Math.max(1, e.timeStamp - (last.time || e.timeStamp));
            const speed = d / dt;

            const target =
              pen.size *
              clamp(1.4 - speed * (pen.mode === 'artistic' ? 0.55 : 0.32), 0.5, 1.55);

            width = last.w ? last.w + (target - last.w) * 0.3 : target;
          }
        }

        return { x: world.x, y: world.y, w: width, time: e.timeStamp };
      }

      function startStroke(e) {
        pushUndo();

        const world = screenToWorld(e.clientX, e.clientY);

        currentStroke = {
          id: makeId(),
          type: 'stroke',
          mode: pen.mode,
          color: pen.color,
          size: pen.mode === 'highlighter' ? pen.size * 2.3 : pen.size,
          opacity: pen.mode === 'highlighter' ? 0.32 : 1,
          points: [makeStrokePoint(e, world, null)]
        };

        activeGesture = { kind: 'stroke' };
      }

      function addStrokePoints(e) {
        if (!currentStroke) return;

        const events =
          typeof e.getCoalescedEvents === 'function' ? e.getCoalescedEvents() : [e];

        for (const ev of events) {
          const world = screenToWorld(ev.clientX, ev.clientY);
          const last = currentStroke.points[currentStroke.points.length - 1];

          const screenDistance = Math.hypot(
            (world.x - last.x) * state.view.scale,
            (world.y - last.y) * state.view.scale
          );

          if (screenDistance < 0.8) continue;

          currentStroke.points.push(makeStrokePoint(ev, world, last));
        }
      }

      function finalizeStroke() {
        if (!currentStroke) return;

        if (currentStroke.points.length) {
          state.objects.push(currentStroke);
        } else {
          popLastUndoIfUnused();
        }

        currentStroke = null;
        activeGesture = null;
        renderAll();
      }

      function startErase(e) {
        pushUndo();
        isErasing = true;
        activeGesture = { kind: 'erase', changed: false };
        eraseAtClient(e.clientX, e.clientY);
      }

      function eraseAtClient(clientX, clientY) {
        const world = screenToWorld(clientX, clientY);
        const radiusWorld = eraser.size / 2 / state.view.scale;

        const next = [];
        let changed = false;

        for (const obj of state.objects) {
          const replacements = eraseObject(obj, world.x, world.y, radiusWorld);

          if (replacements.length === 1 && replacements[0] === obj) {
            next.push(obj);
          } else {
            changed = true;
            next.push(...replacements);
          }
        }

        if (changed) {
          state.objects = next;
          if (activeGesture?.kind === 'erase') activeGesture.changed = true;
          renderAll();
        }
      }

      function eraseObject(obj, x, y, r) {
        if (!eraser.precision) {
          return hitTestObject(obj, x, y, r) ? [] : [obj];
        }

        if (obj.type === 'stroke') return eraseStroke(obj, x, y, r);

        return hitTestObject(obj, x, y, r) ? [] : [obj];
      }

      function eraseStroke(stroke, x, y, r) {
        const pts = stroke.points;
        if (!pts.length) return [];

        const vertexErased = pts.map((p) => {
          return Math.hypot(p.x - x, p.y - y) <= r + ((p.w ?? stroke.size) / 2);
        });

        const edgeErased = [];

        for (let i = 0; i < pts.length - 1; i++) {
          const rr =
            r + Math.max(pts[i].w ?? stroke.size, pts[i + 1].w ?? stroke.size) / 2;

          edgeErased[i] = segmentIntersectsCircle(pts[i], pts[i + 1], { x, y }, rr);
        }

        const anyErased = vertexErased.some(Boolean) || edgeErased.some(Boolean);
        if (!anyErased) return [stroke];

        const pieces = [];
        let current = [];

        for (let i = 0; i < pts.length; i++) {
          if (vertexErased[i]) {
            if (current.length) pieces.push(makeStrokePiece(stroke, current));
            current = [];
            continue;
          }

          if (current.length === 0) {
            current = [pts[i]];
          } else if (edgeErased[i - 1]) {
            if (current.length) pieces.push(makeStrokePiece(stroke, current));
            current = [pts[i]];
          } else {
            current.push(pts[i]);
          }
        }

        if (current.length) pieces.push(makeStrokePiece(stroke, current));

        return pieces.filter((p) => p.points.length);
      }

      function makeStrokePiece(stroke, points) {
        return {
          ...stroke,
          id: makeId(),
          points: points.map((p) => ({ ...p }))
        };
      }

      function startShape(e) {
        pushUndo();

        const world = screenToWorld(e.clientX, e.clientY);

        currentShape = {
          id: makeId(),
          type: 'shape',
          shape: shapeStyle.shape,
          x1: world.x,
          y1: world.y,
          x2: world.x,
          y2: world.y,
          strokeColor: shapeStyle.strokeColor,
          fillColor: shapeStyle.fillColor,
          strokeWidth: shapeStyle.strokeWidth,
          fillStyle: shapeStyle.fillStyle,
          edges: shapeStyle.edges
        };

        activeGesture = { kind: 'shape' };
      }

      function updateShape(e) {
        if (!currentShape) return;

        const world = screenToWorld(e.clientX, e.clientY);
        currentShape.x2 = world.x;
        currentShape.y2 = world.y;

        if (e.shiftKey) {
          const dx = world.x - currentShape.x1;
          const dy = world.y - currentShape.y1;
          const m = Math.max(Math.abs(dx), Math.abs(dy));

          currentShape.x2 = currentShape.x1 + Math.sign(dx || 1) * m;
          currentShape.y2 = currentShape.y1 + Math.sign(dy || 1) * m;
        }
      }

      function finalizeShape() {
        if (!currentShape) return;

        const b = getShapeBBox(currentShape);

        if (b.w * state.view.scale < 3 && b.h * state.view.scale < 3) {
          popLastUndoIfUnused();
        } else {
          state.objects.push(currentShape);
        }

        currentShape = null;
        activeGesture = null;
        renderAll();
      }

      function startText(e) {
        const world = screenToWorld(e.clientX, e.clientY);
        createTextEditor(world, null);
      }

      function createTextEditor(world, existing) {
        const screen = worldToScreenPoint(world);

        const el = document.createElement('textarea');
        el.className = 'text-editor';
        el.value = existing ? existing.text : '';
        el.style.left = `${screen.x}px`;
        el.style.top = `${screen.y}px`;
        el.style.fontSize = `${(existing ? existing.fontSize : 24) * state.view.scale}px`;
        el.style.color = existing ? existing.color : pen.color;

        container.appendChild(el);
        el.focus();

        const commit = () => {
          if (el.dataset.done) return;
          el.dataset.done = '1';

          const text = el.value.replace(/\s+$/, '');
          const original = existing ? existing.text : '';

          if (existing && text === original) {
            el.remove();
            return;
          }

          if (!existing && !text) {
            el.remove();
            return;
          }

          pushUndo();

          if (existing) {
            if (text) {
              existing.text = text;
            } else {
              state.objects = state.objects.filter((o) => o !== existing);
              state.selected.delete(existing.id);
            }
          } else if (text) {
            state.objects.push({
              id: makeId(),
              type: 'text',
              text,
              x: world.x,
              y: world.y,
              fontSize: 24,
              color: pen.color
            });
          }

          el.remove();
          renderAll();
        };

        el.addEventListener('blur', commit);
        el.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            el.value = existing ? existing.text : '';
            el.blur();
          } else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
            el.blur();
          }
        });
      }

      function translateObject(obj, dx, dy) {
        if (obj.type === 'stroke') {
          for (const p of obj.points || []) {
            p.x += dx;
            p.y += dy;
          }
        } else if (obj.type === 'shape') {
          obj.x1 += dx;
          obj.y1 += dy;
          obj.x2 += dx;
          obj.y2 += dy;
        } else if (obj.type === 'text') {
          obj.x += dx;
          obj.y += dy;
        }
      }

      function handleSelectPointerDown(e) {
        const world = screenToWorld(e.clientX, e.clientY);
        const hit = topHit(world.x, world.y);

        if (hit) {
          if (e.detail === 2 && hit.type === 'text') {
            createTextEditor({ x: hit.x, y: hit.y }, hit);
            try {
              overlayCanvas.releasePointerCapture(e.pointerId);
            } catch (_) {}
            return;
          }

          if (!state.selected.has(hit.id)) {
            if (!e.shiftKey) state.selected.clear();
            state.selected.add(hit.id);
          }

          moveState = {
            startClient: { x: e.clientX, y: e.clientY },
            lastWorld: world,
            objects: state.objects.filter((o) => state.selected.has(o.id))
          };

          activeGesture = { kind: 'move', moved: false };
          renderOverlay();
        } else {
          if (!e.shiftKey) state.selected.clear();
          renderOverlay();
          startPan(e);
        }
      }

      function moveSelected(e) {
        if (!moveState || !activeGesture) return;

        const world = screenToWorld(e.clientX, e.clientY);

        const dxScreen = e.clientX - moveState.startClient.x;
        const dyScreen = e.clientY - moveState.startClient.y;

        if (!activeGesture.moved && Math.hypot(dxScreen, dyScreen) < 3) return;

        if (!activeGesture.moved) {
          pushUndo();
          activeGesture.moved = true;
        }

        const dx = world.x - moveState.lastWorld.x;
        const dy = world.y - moveState.lastWorld.y;

        moveState.lastWorld = world;

        for (const obj of moveState.objects) {
          translateObject(obj, dx, dy);
        }

        renderAll();
      }

      function deleteSelected() {
        if (!state.selected.size) return;

        pushUndo();
        state.objects = state.objects.filter((o) => !state.selected.has(o.id));
        state.selected.clear();
        renderAll();
      }

      function clearBoard() {
        pushUndo();
        state.objects = [];
        state.selected.clear();
        renderAll();
      }

      function startPan(e) {
        isPanning = true;
        activeGesture = { kind: 'pan' };
        panStart = { x: e.clientX, y: e.clientY, view: { ...state.view } };
        overlayCanvas.style.cursor = 'grabbing';
      }

      function movePan(e) {
        if (!panStart) return;

        state.view.x = panStart.view.x + (e.clientX - panStart.x);
        state.view.y = panStart.view.y + (e.clientY - panStart.y);

        renderAll();
      }

      function startPinch() {
        const pts = Array.from(pointers.values());
        if (pts.length < 2) return;

        const r = containerRect();

        const center = {
          x: (pts[0].x + pts[1].x) / 2 - r.left,
          y: (pts[0].y + pts[1].y) / 2 - r.top
        };

        const distance = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);

        pinch = {
          initialDistance: distance,
          initialScale: state.view.scale,
          initialCenter: center,
          initialView: { ...state.view }
        };
      }

      function handlePinch() {
        const pts = Array.from(pointers.values());
        if (!pinch || pts.length < 2) return;

        const r = containerRect();

        const center = {
          x: (pts[0].x + pts[1].x) / 2 - r.left,
          y: (pts[0].y + pts[1].y) / 2 - r.top
        };

        const distance = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);

        const scale = clamp(
          pinch.initialScale * (distance / Math.max(1, pinch.initialDistance)),
          0.1,
          8
        );

        const worldCenter = {
          x: (pinch.initialCenter.x - pinch.initialView.x) / pinch.initialScale,
          y: (pinch.initialCenter.y - pinch.initialView.y) / pinch.initialScale
        };

        state.view.scale = scale;
        state.view.x = center.x - worldCenter.x * scale;
        state.view.y = center.y - worldCenter.y * scale;

        renderAll();
      }

      function cancelActiveInteraction() {
        if (currentStroke) {
          currentStroke = null;
          if (activeGesture?.kind === 'stroke') popLastUndoIfUnused();
        }

        if (currentShape) {
          currentShape = null;
          if (activeGesture?.kind === 'shape') popLastUndoIfUnused();
        }

        if (isErasing) {
          isErasing = false;
          if (activeGesture?.kind === 'erase' && !activeGesture.changed) {
            popLastUndoIfUnused();
          }
        }

        if (activeGesture?.kind === 'move' && !activeGesture.moved) {
          moveState = null;
        }

        isPanning = false;
        activeGesture = null;
        panStart = null;
        pinch = null;

        renderAll();
      }

      function zoomAtClient(clientX, clientY, factor) {
        const local = toLocal(clientX, clientY);

        const before = {
          x: (local.x - state.view.x) / state.view.scale,
          y: (local.y - state.view.y) / state.view.scale
        };

        state.view.scale = clamp(state.view.scale * factor, 0.1, 8);
        state.view.x = local.x - before.x * state.view.scale;
        state.view.y = local.y - before.y * state.view.scale;

        renderAll();
      }

      function zoomAtCenter(factor) {
        const r = containerRect();
        zoomAtClient(r.left + r.width / 2, r.top + r.height / 2, factor);
      }

      function onPointerDown(e) {
        overlayCanvas.setPointerCapture(e.pointerId);
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        lastPointerClient = { x: e.clientX, y: e.clientY };
        pointerOverCanvas = true;

        if (pointers.size === 2) {
          cancelActiveInteraction();
          startPinch();
          return;
        }

        if (e.button === 1 || e.button === 2 || state.tool === 'hand' || spaceDown) {
          startPan(e);
          return;
        }

        if (state.tool === 'pen') {
          startStroke(e);
          return;
        }

        if (state.tool === 'eraser') {
          startErase(e);
          return;
        }

        if (state.tool === 'shape') {
          startShape(e);
          return;
        }

        if (state.tool === 'text') {
          startText(e);
          try {
            overlayCanvas.releasePointerCapture(e.pointerId);
          } catch (_) {}
          return;
        }

        if (state.tool === 'select') {
          handleSelectPointerDown(e);
        }
      }

      function onPointerMove(e) {
        lastPointerClient = { x: e.clientX, y: e.clientY };
        pointerOverCanvas = true;

        if (pointers.has(e.pointerId)) {
          pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        }

        if (pinch && pointers.size === 2) {
          handlePinch();
          return;
        }

        if (isPanning && activeGesture?.kind === 'pan') {
          movePan(e);
          return;
        }

        if (state.tool === 'pen' && currentStroke) {
          addStrokePoints(e);
          requestRenderOverlay();
          return;
        }

        if (state.tool === 'eraser' && isErasing) {
          eraseAtClient(e.clientX, e.clientY);
          return;
        }

        if (state.tool === 'shape' && currentShape) {
          updateShape(e);
          requestRenderOverlay();
          return;
        }

        if (state.tool === 'select' && activeGesture?.kind === 'move') {
          moveSelected(e);
          return;
        }

        requestRenderOverlay();
      }

      function onPointerUp(e) {
        pointers.delete(e.pointerId);

        if (pinch && pointers.size < 2) pinch = null;

        if (activeGesture?.kind === 'pan') {
          isPanning = false;
          activeGesture = null;
          panStart = null;
          overlayCanvas.style.cursor = '';
          renderAll();
          return;
        }

        if (currentStroke) {
          finalizeStroke();
          return;
        }

        if (currentShape) {
          finalizeShape();
          return;
        }

        if (isErasing) {
          isErasing = false;

          if (activeGesture?.kind === 'erase' && !activeGesture.changed) {
            popLastUndoIfUnused();
          }

          activeGesture = null;
          renderAll();
          return;
        }

        if (activeGesture?.kind === 'move') {
          activeGesture = null;
          moveState = null;
          renderAll();
        }
      }

      function spawnReaction(emoji) {
        const el = document.createElement('div');
        el.className = 'reaction-float';
        el.textContent = emoji;
        el.style.left = `${15 + Math.random() * 70}vw`;

        document.body.appendChild(el);
        setTimeout(() => el.remove(), 2100);
      }

      function setTool(tool) {
        state.tool = tool;

        $$('[data-tool]').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.tool === tool);
        });

        if (tool === 'hand') overlayCanvas.style.cursor = 'grab';
        else if (tool === 'select') overlayCanvas.style.cursor = 'default';
        else overlayCanvas.style.cursor = 'crosshair';

        if (tool !== 'select') state.selected.clear();

        renderOverlay();
      }

      function updateTimerDisplay() {
        const m = Math.floor(timerRemaining / 60);
        const s = timerRemaining % 60;

        $('#timerDisplay').textContent =
          `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }

      function resetTimer() {
        const mins = Number($('#timerMinutes')?.value || 0);
        const secs = Number($('#timerSeconds')?.value || 0);

        timerRemaining = Math.max(0, mins * 60 + secs);
        updateTimerDisplay();
      }

      function startTimer() {
        if (timerInterval) return;

        if (timerRemaining <= 0) resetTimer();

        timerInterval = setInterval(() => {
          timerRemaining = Math.max(0, timerRemaining - 1);
          updateTimerDisplay();

          if (timerRemaining === 0) {
            clearInterval(timerInterval);
            timerInterval = null;
            spawnReaction('⏰');
          }
        }, 1000);
      }

      function pauseTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
      }

      function bindUI() {
        $$('[data-tool]').forEach((btn) => {
          btn.addEventListener('click', () => setTool(btn.dataset.tool));
        });

        $$('[data-action]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const action = btn.dataset.action;

            if (action === 'undo') undo();
            if (action === 'redo') redo();
            if (action === 'clear') clearBoard();

            if (action === 'zoomIn') zoomAtCenter(1.1);
            if (action === 'zoomOut') zoomAtCenter(0.9);

            if (action === 'zoomReset') {
              state.view = { x: 0, y: 0, scale: 1 };
              renderAll();
            }

            if (action === 'invite') {
              alert('Invite flow can be connected to your existing PrimeBoard backend.');
            }

            if (action === 'library') {
              alert('Shape & Sticker Library can be connected here.');
            }

            if (action === 'share') {
              alert('Share link can be generated from your existing board session.');
            }

            if (action === 'toolkit') {
              alert('Educational Toolkit modules can be mounted here without changing the board engine.');
            }

            if (action === 'graph') {
              alert('Graph module can be connected to your existing Graph Plotter code.');
            }

            if (action === 'math') {
              alert('Math module can be connected to your existing Equation / Math tools.');
            }

            if (action === 'spotlight') {
              alert('Spotlight can be implemented as a temporary focus overlay.');
            }

            if (action === 'record') {
              alert('Recording can be connected to canvas.captureStream() + MediaRecorder if needed.');
            }

            if (action === 'addStudent') {
              const ta = $('#inviteEmails');
              if (!ta) return;

              ta.value = ta.value ? `${ta.value.replace(/\s+$/, '')}, ` : '';
              ta.focus();
            }

            if (action === 'sendInvites') {
              const emails = ($('#inviteEmails')?.value || '')
                .split(',')
                .map((s) => s.trim())
                .filter(Boolean);

              alert(
                emails.length
                  ? `Invites queued for ${emails.length} student(s). Connect this to your PrimeBoard backend.`
                  : 'Add at least one student email address.'
              );
            }
          });
        });

        $$('[data-timer]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const t = btn.dataset.timer;

            if (t === 'start') startTimer();
            if (t === 'pause') pauseTimer();
            if (t === 'reset') resetTimer();
          });
        });

        $('#timerMinutes')?.addEventListener('change', resetTimer);
        $('#timerSeconds')?.addEventListener('change', resetTimer);

        $('#penColor')?.addEventListener('input', (e) => {
          pen.color = e.target.value;
        });

        $('#penSize')?.addEventListener('input', (e) => {
          pen.size = Number(e.target.value);
          $('#penSizeValue').textContent = `${pen.size}px`;
        });

        $('#penMode')?.addEventListener('change', (e) => {
          pen.mode = e.target.value;
        });

        $('#eraserSize')?.addEventListener('input', (e) => {
          eraser.size = Number(e.target.value);
          $('#eraserSizeValue').textContent = `${eraser.size}px`;
          requestRenderOverlay();
        });

        $('#precisionEraser')?.addEventListener('change', (e) => {
          eraser.precision = e.target.checked;
        });

        $('#shapeType')?.addEventListener('change', (e) => {
          shapeStyle.shape = e.target.value;
        });

        $('#shapeStrokeColor')?.addEventListener('input', (e) => {
          shapeStyle.strokeColor = e.target.value;
        });

        $('#shapeFillColor')?.addEventListener('input', (e) => {
          shapeStyle.fillColor = e.target.value;
        });

        $('#shapeStrokeWidth')?.addEventListener('input', (e) => {
          shapeStyle.strokeWidth = Number(e.target.value);
        });

        $('#fillStyle')?.addEventListener('change', (e) => {
          shapeStyle.fillStyle = e.target.value;
        });

        $('#edgeStyle')?.addEventListener('change', (e) => {
          shapeStyle.edges = e.target.value;
        });

        $('#backgroundColor')?.addEventListener('input', (e) => {
          state.background = e.target.value;
          renderAll();
        });

        $('#gridStyle')?.addEventListener('change', (e) => {
          state.gridStyle = e.target.value;
          renderAll();
        });

        $$('[data-reaction]').forEach((btn) => {
          btn.addEventListener('click', () => spawnReaction(btn.dataset.reaction));
        });

        $('#enterBoardBtn')?.addEventListener('click', () => {
          const code = $('#classCode')?.value.trim() || 'demo';
          const btn = $('#enterBoardBtn');

          btn.textContent = `Joined ${code}`;
          btn.disabled = true;

          spawnReaction('🎉');
        });
      }

      container.addEventListener(
        'wheel',
        (e) => {
          e.preventDefault();

          if (e.ctrlKey || e.metaKey) {
            zoomAtClient(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0022));
          } else {
            state.view.x -= e.deltaX;
            state.view.y -= e.deltaY;
            renderAll();
          }
        },
        { passive: false }
      );

      overlayCanvas.addEventListener('contextmenu', (e) => e.preventDefault());
      overlayCanvas.addEventListener('pointerdown', onPointerDown);
      overlayCanvas.addEventListener('pointermove', onPointerMove);

      window.addEventListener('pointerup', onPointerUp);
      window.addEventListener('pointercancel', onPointerUp);

      overlayCanvas.addEventListener('pointerleave', () => {
        pointerOverCanvas = false;
        requestRenderOverlay();
      });

      window.addEventListener('keydown', (e) => {
        const target = e.target;

        if (
          target instanceof HTMLInputElement ||
          target instanceof HTMLTextAreaElement ||
          target instanceof HTMLSelectElement
        ) {
          return;
        }

        if (e.code === 'Space') {
          spaceDown = true;
          overlayCanvas.style.cursor = 'grab';
          e.preventDefault();
          return;
        }

        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
          e.preventDefault();
          if (e.shiftKey) redo();
          else undo();
          return;
        }

        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
          e.preventDefault();
          redo();
          return;
        }

        if (e.key === 'Delete' || e.key === 'Backspace') {
          deleteSelected();
          return;
        }

        const k = e.key.toLowerCase();

        if (k === 'v') setTool('select');
        if (k === 'h') setTool('hand');
        if (k === 'p') setTool('pen');
        if (k === 'e') setTool('eraser');
        if (k === 's' && !e.ctrlKey && !e.metaKey) setTool('shape');
        if (k === 't') setTool('text');

        if (k === '+' || e.key === '=') zoomAtCenter(1.1);
        if (k === '-') zoomAtCenter(0.9);

        if (k === '0') {
          state.view = { x: 0, y: 0, scale: 1 };
          renderAll();
        }
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'Space') {
          spaceDown = false;
          overlayCanvas.style.cursor =
            state.tool === 'hand'
              ? 'grab'
              : state.tool === 'select'
              ? 'default'
              : 'crosshair';
        }
      });

      const ro = new ResizeObserver(resizeCanvases);
      ro.observe(container);

      window.addEventListener('resize', resizeCanvases);

      bindUI();
      resizeCanvases();
      setTool('pen');
      updateUndoButtons();
      resetTimer();
      renderAll();
    })();
  </script>
</body>
</html>
