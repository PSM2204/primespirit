<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeTestQ Hub | Prime Spirit Mentors</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="aurora-container">
        <div class="aurora-glow aurora-1"></div>
        <div class="aurora-glow aurora-2"></div>
    </div>
    <div class="spotlight-shield"></div>

    <div id="app-view-viewport">
        <!-- Home Hub -->
        <div id="screen-home-hub">
            <div class="hub-header">
                <div class="brand-logotype">PRIMETESTQ // MISSION CONTROL</div>
                <div class="user-profile-badge">SECURE ATOMIC ENVIRONMENT</div>
            </div>
            <div class="orbit-universe-wrapper">
                <div class="center-core-hub">
                    <h1 style="font-size: 2rem; font-weight: 900; color: var(--primary-neon); letter-spacing: 0.1em;">PRIMECORE</h1>
                    <p style="font-size: 0.7rem; color: #A0AEC0; margin-top: 5px;">NUCLEUS</p>
                </div>
                <div class="orbital-ring path-orbit-1"><div class="orbit-node" data-ecosystem="class6"><div class="glass-panel" style="--theme-color: #FFD700;"><i class="fas fa-atom"></i> Class 6th</div></div></div>
                <div class="orbital-ring path-orbit-2"><div class="orbit-node" data-ecosystem="class7"><div class="glass-panel" style="--theme-color: #FFD700;"><i class="fas fa-atom"></i> Class 7th</div></div></div>
                <div class="orbital-ring path-orbit-3"><div class="orbit-node" data-ecosystem="class8"><div class="glass-panel" style="--theme-color: #FFD700;"><i class="fas fa-atom"></i> Class 8th</div></div></div>
                <div class="orbital-ring path-orbit-4"><div class="orbit-node" data-ecosystem="class9"><div class="glass-panel" style="--theme-color: #FFD700;"><i class="fas fa-atom"></i> Class 9th</div></div></div>
                <div class="orbital-ring path-orbit-5"><div class="orbit-node" data-ecosystem="class10"><div class="glass-panel" style="--theme-color: #FFD700;"><i class="fas fa-atom"></i> Class 10th</div></div></div>
                <div class="orbital-ring path-orbit-6"><div class="orbit-node" data-ecosystem="class11"><div class="glass-panel" style="--theme-color: #FFD700;"><i class="fas fa-atom"></i> Class 11th</div></div></div>
                <div class="orbital-ring path-orbit-7"><div class="orbit-node" data-ecosystem="class12"><div class="glass-panel" style="--theme-color: #FFD700;"><i class="fas fa-atom"></i> Class 12th</div></div></div>
                <div class="orbital-ring path-orbit-8"><div class="orbit-node" data-ecosystem="jee-main"><div class="glass-panel" style="--theme-color: #00C6FF;"><i class="fas fa-rocket"></i> JEE Main</div></div></div>
                <div class="orbital-ring path-orbit-9"><div class="orbit-node" data-ecosystem="neet"><div class="glass-panel" style="--theme-color: #00FF99;"><i class="fas fa-heartbeat"></i> NEET UG</div></div></div>
                <div class="orbital-ring path-orbit-10">
                    <div class="orbit-node" data-ecosystem="iat"><div class="glass-panel" style="--theme-color: #9D4EDD;"><i class="fas fa-flask"></i> IAT CBT</div></div>
                    <div class="orbit-node" data-ecosystem="nest"><div class="glass-panel" style="--theme-color: #00FFFF;"><i class="fas fa-dna"></i> NEST CBT</div></div>
                    <div class="orbit-node" data-ecosystem="cuet"><div class="glass-panel" style="--theme-color: #FF6B6B;"><i class="fas fa-university"></i> CUET CBT</div></div>
                </div>
            </div>
            <footer>
                <p>PRIME SPIRIT MENTORS © 2026 // ATOMIC MODEL EVALUATION INTERFACE</p>
                <p id="network-status-indicator" style="font-size: 0.7rem; color: var(--accent-glow); margin-top: 5px;">SECURE ENVIRONMENT SYNC ACTIVE</p>
            </footer>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
