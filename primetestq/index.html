<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeTestQ Hub | Prime Spirit Mentors</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="dashboard.css">
    <style>
        /* Stable, Non-Rotating Controller Cards placed outside the Orbit Mesh */
        .stable-control-hud {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(13, 20, 38, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 24px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            pointer-events: auto !important;
        }

        .stable-hud-label {
            color: #A0AEC0;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            font-family: monospace;
        }

        .stable-dropdown {
            background: #090D1A;
            border: 1px solid rgba(0, 198, 255, 0.2);
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            outline: none;
            cursor: pointer;
            pointer-events: auto !important;
            transition: border-color 0.2s;
        }
        .stable-dropdown:hover {
            border-color: #00C6FF;
        }
        .stable-dropdown option {
            background: #0d1426;
            color: #fff;
        }

        /* Enforce absolute priority click rules directly on individual target nodes */
        .orbit-node {
            pointer-events: auto !important;
            cursor: pointer !important;
        }
        .orbital-ring {
            pointer-events: none !important;
        }
        .orbit-universe-wrapper {
            pointer-events: none !important;
        }
    </style>
</head>
<body>

    <div id="app-view-viewport">
        <div id="screen-home-hub">
            <header class="hub-header">
                <div class="brand-logotype">PRIMETESTQ // MISSION CONTROL</div>
                <div class="user-profile-badge">CANDIDATE SECURE NODE</div>
            </header>

            <div class="stable-control-hud">
                <div class="stable-hud-label"><i class="fas fa-graduation-cap" style="color:#FF9F43; margin-right:6px;"></i> SCHOOL LOG TRACK:</div>
                <select class="stable-dropdown" id="dropdown-juniors">
                    <option value="" disabled selected>Choose Class</option>
                    <option value="class6">Class 6th Mock</option>
                    <option value="class7">Class 7th Mock</option>
                    <option value="class8">Class 8th Mock</option>
                    <option value="class9">Class 9th Mock</option>
                    <option value="class10">Class 10th Mock</option>
                    <option value="class11">Class 11th Mock</option>
                    <option value="class12">Class 12th Mock</option>
                </select>
            </div>

            <div class="orbit-universe-wrapper">
                <div class="center-core-hub">
                    <h1 style="font-size: 1.8rem; font-weight: 900; letter-spacing: 0.1em; color:#fff;">SELECT<br><span style="color:var(--primary-neon);">TRACK</span></h1>
                    <p style="font-size:0.65rem; color:#A0AEC0; margin-top:10px; letter-spacing:0.2em;">ORBIT INTERFACE</p>
                </div>

                <div class="orbital-ring path-neet" style="--rotation-speed: 45s;">
                    <div class="orbit-node node-neet glass-panel" data-ecosystem="neet" style="--theme-color: #00FF99; pointer-events: auto !important;">
                        <i class="fas fa-stethoscope"></i> <span>NEET UG CBT</span>
                    </div>
                </div>

                <div class="orbital-ring path-jee" style="--rotation-speed: 55s;">
                    <div class="orbit-node node-jee glass-panel" data-ecosystem="jee" style="--theme-color: #00C6FF; pointer-events: auto !important;">
                        <i class="fas fa-atom"></i> <span>JEE Main CBT</span>
                    </div>
                </div>

                <div class="orbital-ring path-iat" style="--rotation-speed: 65s;">
                    <div class="orbit-node node-iat glass-panel" data-ecosystem="iat" style="--theme-color: #A855F7; pointer-events: auto !important;">
                        <i class="fas fa-flask"></i> <span>IAT CBT</span>
                    </div>
                </div>

                <div class="orbital-ring path-nest" style="--rotation-speed: 75s;">
                    <div class="orbit-node node-nest glass-panel" data-ecosystem="nest" style="--theme-color: #EC4899; pointer-events: auto !important;">
                        <i class="fas fa-microscope"></i> <span>NEST CBT</span>
                    </div>
                </div>
            </div>

            <footer style="color:rgba(255,255,255,0.2); font-size:0.75rem; font-family:monospace; letter-spacing:0.1em;">
                PRIME SPIRIT MENTORS © 2026 // SECURE EVALUATION ENVIRONMENT
            </footer>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
