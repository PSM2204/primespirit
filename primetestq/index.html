    <!-- 4. EXAM COCKPIT SIMULATION -->
    <div id="screen-cockpit-simulation" class="hidden">
        <div class="cockpit-bar">
            <div class="brand-logotype" id="cockpit-title-label">CBT HUD</div>
            
            <!-- NEW: Global Actions (Pause & Exit) -->
            <div class="cockpit-global-actions" style="display:flex; gap:10px;">
                <button id="btn-cockpit-pause" class="btn-magnetic" style="padding: 6px 16px; font-size: 0.75rem;">⏸ PAUSE</button>
                <button id="btn-cockpit-exit" class="btn-magnetic" style="padding: 6px 16px; font-size: 0.75rem; border-color: #FF4D4D; color: #FF4D4D;">✕ EXIT</button>
            </div>

            <div class="instrumentation-timer-block">
                <span id="clock-digital-hud" class="timer-numerical-display">00:00:00</span>
            </div>
        </div>

        <div class="cockpit-workstation-grid">
            <div class="question-workspace glass-panel-static">
                <div id="hud-question-index-number" style="font-size: 0.8rem; color: var(--primary-neon); margin-bottom: 10px; font-weight: 700;">Q. 1 // SUBJECT: --</div>
                <div id="hud-question-render-viewport" style="font-size: 1.1rem; line-height: 1.6; margin-bottom: 25px; min-height: 80px;">Loading examination matrix sheets...</div>
                <div id="hud-options-render-viewport"></div>

                <div class="cockpit-control-toolbar-row">
                    <div class="left-action-cluster">
                        <button id="btn-action-prev" class="btn-magnetic">PREVIOUS</button>
                        <button id="btn-action-review" class="btn-magnetic" style="border-color: var(--status-review); color: var(--status-review);">MARK REVIEW</button>
                        <button id="btn-action-clear" class="btn-magnetic">CLEAR</button>
                    </div>
                    <button id="btn-action-next" class="btn-magnetic" style="background: var(--primary-neon); color: #000; border-color: var(--primary-neon);">SAVE & NEXT</button>
                </div>
            </div>

            <div class="telemetry-palette-panel glass-panel-static">
                <h3 style="font-size: 0.9rem; color: #A0AEC0; margin-bottom: 15px; letter-spacing: 0.05em;">TEST TELEMETRY PALETTE</h3>
                <div id="hud-palette-circles-grid" class="circles-status-matrix"></div>
                <button id="btn-cockpit-submit" class="btn-magnetic w-full" style="margin-top: auto; background: rgba(255, 77, 77, 0.1); border-color: #FF4D4D; color: #FF4D4D;">SUBMIT CORE TEST</button>
            </div>
        </div>
    </div>

    <!-- NEW: PAUSE OVERLAY -->
    <div id="pause-overlay" class="pause-overlay hidden">
        <div class="glass-panel-static" style="padding: 40px; text-align: center; max-width: 400px; width: 90%;">
            <h2 style="font-size: 1.5rem; font-weight: 900; color: var(--primary-neon); margin-bottom: 10px;">TEST PAUSED</h2>
            <p style="color: #A0AEC0; font-size: 0.8rem; margin-bottom: 20px;">Timer is frozen. Anti-cheating is temporarily suspended.</p>
            <div id="pause-timer-display" style="font-size: 2.5rem; font-weight: 900; font-family: monospace; margin-bottom: 30px; color: #fff;">00:00:00</div>
            <button id="btn-resume-test" class="btn-magnetic" style="background: var(--accent-glow); color: #000; border-color: var(--accent-glow); width: 100%;">▶ RESUME TEST</button>
        </div>
    </div>
