<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeTestQ Hub | Prime Spirit Mentors</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <div id="app-view-viewport">
        <div id="screen-home-hub">
            <header class="hub-header">
                <div class="brand-logotype">PRIMETESTQ // MISSION CONTROL</div>
                <div class="user-profile-badge">CANDIDATE SECURE NODE</div>
            </header>

            <div class="orbit-universe-wrapper">
                <div class="center-core-hub">
                    <h1 style="font-size: 1.8rem; font-weight: 900; letter-spacing: 0.1em; color:#fff;">SELECT<br><span style="color:var(--primary-neon);">TRACK</span></h1>
                    <p style="font-size:0.65rem; color:#A0AEC0; margin-top:10px; letter-spacing:0.2em;">ORBIT INTERFACE</p>
                </div>

                <div class="orbital-ring path-admission" style="--rotation-speed: 25s; width:160px; height:160px;">
                    <div class="orbit-node node-class6 glass-panel" data-ecosystem="class6" style="--theme-color: #FF9F43;">
                        <i class="fas fa-graduation-cap"></i> <span>6th</span>
                    </div>
                </div>
                <div class="orbital-ring path-admission" style="--rotation-speed: 30s; width: 210px; height: 210px;">
                    <div class="orbit-node node-class7 glass-panel" data-ecosystem="class7" style="--theme-color: #FF6B6B;">
                        <i class="fas fa-book-open"></i> <span>7th</span>
                    </div>
                </div>
                <div class="orbital-ring path-admission" style="--rotation-speed: 35s; width: 260px; height: 260px;">
                    <div class="orbit-node node-class8 glass-panel" data-ecosystem="class8" style="--theme-color: #48DBFB;">
                        <i class="fas fa-pencil-alt"></i> <span>8th</span>
                    </div>
                </div>
                <div class="orbital-ring path-admission" style="--rotation-speed: 40s; width: 310px; height: 310px;">
                    <div class="orbit-node node-class9 glass-panel" data-ecosystem="class9" style="--theme-color: #1DD1A1;">
                        <i class="fas fa-calculator"></i> <span>9th</span>
                    </div>
                </div>
                <div class="orbital-ring path-admission" style="--rotation-speed: 45s; width: 360px; height: 360px;">
                    <div class="orbit-node node-class10 glass-panel" data-ecosystem="class10" style="--theme-color: #00D2D3;">
                        <i class="fas fa-flask"></i> <span>10th</span>
                    </div>
                </div>

                <div class="orbital-ring path-neet" style="--rotation-speed: 52s;">
                    <div class="orbit-node node-neet glass-panel" data-ecosystem="neet" style="--theme-color: #00FF99;">
                        <i class="fas fa-stethoscope"></i> <span>NEET UG</span>
                    </div>
                </div>

                <div class="orbital-ring path-jee" style="--rotation-speed: 60s;">
                    <div class="orbit-node node-jee glass-panel" data-ecosystem="jee" style="--theme-color: #00C6FF;">
                        <i class="fas fa-atom"></i> <span>JEE Main</span>
                    </div>
                </div>

                <div class="orbital-ring path-iat" style="--rotation-speed: 70s;">
                    <div class="orbit-node node-iat glass-panel" data-ecosystem="iat" style="--theme-color: #A855F7;">
                        <i class="fas fa-flask"></i> <span>IAT CBT</span>
                    </div>
                </div>

                <div class="orbital-ring path-nest" style="--rotation-speed: 80s;">
                    <div class="orbit-node node-nest glass-panel" data-ecosystem="nest" style="--theme-color: #EC4899;">
                        <i class="fas fa-microscope"></i> <span>NEST CBT</span>
                    </div>
                </div>
            </div>

            <footer style="color:rgba(255,255,255,0.2); font-size:0.75rem; font-family:monospace; letter-spacing:0.1em;">
                PRIME SPIRIT MENTORS © 2026 // SECURE EVALUATION ENVIRONMENT
            </footer>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
