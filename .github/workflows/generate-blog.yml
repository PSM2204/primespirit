name: Generate Blog Post

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/generate-post.js

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Add new auto-generated blog post"
          title: "New blog post draft (review before merging)"
          body: "Auto-generated by GitHub Actions. Please review content for accuracy and tone before merging."
          branch: auto-blog-post
          delete-branch: true

